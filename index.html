  function renderBrickLibrary() {
    document.querySelectorAll('.cat-btn').forEach(btn => {
      const active = btn.dataset.cat === state.selectedCat;
      btn.className = `cat-btn py-1 rounded text-center font-medium cursor-pointer border ${
        active
          ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent'
          : 'bg-[var(--card)] text-[var(--muted-foreground)] border-[var(--border)] hover:text-[var(--foreground)]'
      }`;
    });

    const q = state.searchQuery.trim().toLowerCase();
    const grid = $('brick-grid');
    grid.innerHTML = '';

    const entries = Object.entries(BRICK_DEFS).filter(([key, def]) => {
      if (state.selectedCat !== 'all' && def.cat !== state.selectedCat) return false;
      if (q) {
        const hay = `${key} ${def.name} ${def.short} ${def.shape}`.toLowerCase().replace(/×/g, 'x');
        return hay.includes(q.replace(/×/g, 'x'));
      }
      return true;
    });

    if (entries.length === 0) {
      grid.innerHTML = `<div class="col-span-2 text-xs text-[var(--muted-foreground)] text-center py-6">검색 결과가 없습니다</div>`;
      return;
    }

    entries.forEach(([key, def]) => {
      const btn = document.createElement('button');
      btn.className = `brick-card bg-[var(--card)] border border-[var(--border)] rounded-lg p-1.5 flex flex-col items-center gap-0.5 cursor-pointer ${
        state.selectedType === key ? 'active' : ''
      }`;
      btn.title = `${def.name} (${def.w}×${def.d}, 높이 ${def.h}P)`;
      btn.innerHTML = `
        ${brickThumbSVG(key, state.selectedColor)}
        <span class="text-xs font-medium leading-tight truncate w-full text-center">${def.short}</span>
      `;
      btn.addEventListener('click', () => {
        state.selectedType = key;
        if (state.mode !== 'build') setMode('build');
        renderBrickLibrary();
        updateHUD();
      });
      grid.appendChild(btn);
    });
  }

  function renderColorPalette() {
    const grid = $('color-grid');
    grid.innerHTML = '';
    LEGO_COLORS.forEach(c => {
      const btn = document.createElement('button');
      btn.className = `swatch-btn w-6 h-6 rounded-md border border-black/20 cursor-pointer relative ${
        state.selectedColor === c.hex ? 'active' : ''
      }`;
      if (c.alpha < 1) {
        btn.style.background = `linear-gradient(135deg, ${c.hex}cc 0%, #ffffff99 50%, ${c.hex}bb 100%)`;
      } else if (c.metal) {
        btn.style.background = `linear-gradient(135deg, #fff2a8 0%, ${c.hex} 48%, #8d6d16 100%)`;
      } else {
        btn.style.background = c.hex;
      }
      btn.title = c.name;
      btn.addEventListener('click', () => {
        state.selectedColor = c.hex;
        state.selectedAlpha = c.alpha;
        state.selectedMetal = c.metal;
        $('selected-color-name').textContent = c.name;
        renderColorPalette();
        renderBrickLibrary();
        updateHUD();
      });
      grid.appendChild(btn);
    });

    const bpWrap = $('baseplate-colors');
    bpWrap.innerHTML = '';
    BASEPLATE_PRESETS.forEach(bp => {
      const btn = document.createElement('button');
      btn.className = `swatch-btn w-5 h-5 rounded-full border border-black/20 cursor-pointer ${
        state.baseplateColor === bp.hex ? 'active' : ''
      }`;
      btn.style.background = bp.hex;
      btn.title = `베이스판: ${bp.name}`;
      btn.addEventListener('click', () => {
        state.baseplateColor = bp.hex;
        renderColorPalette();
      });
      bpWrap.appendChild(btn);
    });
  }

  function setMode(m) {
    state.mode = m;
    state.hoverPlacement = null;
    state.hoverBrickId = null;
    document.querySelectorAll('.mode-btn').forEach(btn => {
      const active = btn.dataset.mode === m;
      btn.className = `mode-btn tool-btn px-2.5 py-1 rounded-md text-xs font-medium flex items-center gap-1 cursor-pointer ${
        active ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
      }`;
    });
    canvas.style.cursor = m === 'delete' ? 'crosshair' : (m === 'paint' ? 'cell' : 'default');
    updateHUD();
  }

  function updateHUD() {
    const def = BRICK_DEFS[state.selectedType];
    $('selected-brick-label').textContent = def.short;
    $('hud-color-dot').style.background = state.selectedColor;
    if (state.mode === 'build') $('hud-tool-info').textContent = `${def.name} (${state.rotation * 90}°)`;
    else if (state.mode === 'paint') $('hud-tool-info').textContent = '색칠 모드';
    else $('hud-tool-info').textContent = '삭제 모드';
    $('hud-count').textContent = `${state.bricks.length} 브릭`;
    $('hud-coords').textContent = state.hoverPlacement
      ? `X:${state.hoverPlacement.x} Y:${state.hoverPlacement.y} Z:${state.hoverPlacement.z}`
      : 'X:- Y:- Z:-';
  }

  function updateUndoButtons() {
    $('btn-undo').disabled = state.undoStack.length === 0;
    $('btn-redo').disabled = state.redoStack.length === 0;
  }

  function renderStepList() {
    const listEl = $('step-list');
    listEl.innerHTML = '';
    const uniqueLayers = new Set(state.bricks.map(b => b.y));
    $('step-total-layers').textContent = `${uniqueLayers.size}층`;

    if (state.bricks.length === 0) {
      listEl.innerHTML = `<div class="text-xs text-[var(--muted-foreground)] text-center py-8 px-2">베이스판 위를 클릭해<br/>첫 브릭을 놓아보세요!</div>`;
      return;
    }

    state.bricks.forEach((b, idx) => {
      const def = BRICK_DEFS[b.type];
      const row = document.createElement('div');
      const isActive = (idx === state.visibleStep - 1 && state.visibleStep < state.bricks.length) || state.selectedStepIdx === idx;
      const isFuture = idx >= state.visibleStep;
      row.className = `step-row group flex items-center gap-1.5 px-2 py-1.5 rounded-md border border-transparent hover:bg-[var(--card)] cursor-pointer text-xs ${
        isActive ? 'active' : ''
      } ${isFuture ? 'future' : ''}`;

      row.innerHTML = `
        <span class="font-mono text-[11px] text-[var(--muted-foreground)] w-5 shrink-0 tabular-nums">${idx + 1}</span>
        <span class="w-3 h-3 rounded-xs border border-black/20 shrink-0" style="background:${b.color}"></span>
        <span class="flex-1 truncate font-medium">${def ? def.short : b.type}</span>
        <span class="text-[11px] font-mono text-[var(--muted-foreground)] shrink-0">L${Math.floor(b.y / 3) + 1}</span>
        <div class="hidden group-hover:flex items-center gap-0.5 shrink-0">
          <button data-act="up" class="w-4 h-4 rounded hover:bg-[var(--accent)] flex items-center justify-center" title="위로">↑</button>
          <button data-act="down" class="w-4 h-4 rounded hover:bg-[var(--accent)] flex items-center justify-center" title="아래로">↓</button>
          <button data-act="del" class="w-4 h-4 rounded hover:text-[var(--error)] flex items-center justify-center" title="삭제">×</button>
        </div>
      `;

      row.addEventListener('click', (e) => {
        const act = e.target.dataset && e.target.dataset.act;
        if (act === 'up' && idx > 0) {
          e.stopPropagation(); pushUndo();
          [state.bricks[idx - 1], state.bricks[idx]] = [state.bricks[idx], state.bricks[idx - 1]];
          state.selectedStepIdx = idx - 1; syncUI(); return;
        }
        if (act === 'down' && idx < state.bricks.length - 1) {
          e.stopPropagation(); pushUndo();
          [state.bricks[idx + 1], state.bricks[idx]] = [state.bricks[idx], state.bricks[idx + 1]];
          state.selectedStepIdx = idx + 1; syncUI(); return;
        }
        if (act === 'del') {
          e.stopPropagation(); pushUndo();
          state.bricks.splice(idx, 1);
          state.visibleStep = Math.min(state.visibleStep, state.bricks.length);
          state.selectedStepIdx = null; syncUI(); return;
        }
        stopPlayback();
        setVisibleStep(idx + 1, true);
        state.selectedStepIdx = idx;
        renderStepList();
      });

      listEl.appendChild(row);
    });
  }

  function updateTimelineUI() {
    const total = state.bricks.length;
    const slider = $('step-slider');
    slider.max = total;
    slider.value = state.visibleStep;
    $('step-readout').textContent = `${state.visibleStep} / ${total}`;

    const isPartial = total > 0 && state.visibleStep < total;
    $('preview-mode-banner').classList.toggle('hidden', !isPartial && !state.isPlaying);
    if (state.isPlaying) $('preview-mode-text').textContent = `조립 재생 중 (${state.visibleStep}/${total})`;
    else if (isPartial) $('preview-mode-text').textContent = `단계 ${state.visibleStep}/${total} 미리보기 (편집하려면 전체 보기)`;

    $('icon-play').classList.toggle('hidden', state.isPlaying);
    $('icon-pause').classList.toggle('hidden', !state.isPlaying);
  }

  function setVisibleStep(n, triggerDrop = false) {
    const prev = state.visibleStep;
    state.visibleStep = Math.max(0, Math.min(state.bricks.length, n));
    if (triggerDrop && state.dropAnimEnabled && state.visibleStep > prev && state.visibleStep > 0) {
      state.animatingStepIndex = state.visibleStep - 1;
      state.dropProgress = 0.0;
    } else {
      state.animatingStepIndex = -1;
      state.dropProgress = 1.0;
    }
    updateTimelineUI();
    renderStepList();
  }

  function stopPlayback() { state.isPlaying = false; updateTimelineUI(); }

  function togglePlayback() {
    if (state.bricks.length === 0) return;
    if (state.isPlaying) { stopPlayback(); return; }
    if (state.visibleStep >= state.bricks.length) state.visibleStep = 0;
    state.isPlaying = true;
    state.playTimer = 0;
    state.selectedStepIdx = null;
    updateTimelineUI();
  }

  function syncUI() {
    updateHUD();
    updateUndoButtons();
    updateTimelineUI();
    renderStepList();
    renderColorPalette();
  }

  // =========================================================================
  // 8. POINTER, ORBIT, ZOOM & KEYBOARD EVENTS
  // =========================================================================
  let pointerDown = false, dragMoved = false;
  let downX = 0, downY = 0, lastX = 0, lastY = 0, dragButton = 0, panMode = false;

  canvas.addEventListener('contextmenu', e => e.preventDefault());

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointerDown = true; dragMoved = false;
    downX = lastX = e.clientX; downY = lastY = e.clientY;
    dragButton = e.button;
    panMode = e.shiftKey || e.button === 1;
  });

  canvas.addEventListener('pointermove', e => {
    if (pointerDown) {
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      if (Math.hypot(e.clientX - downX, e.clientY - downY) > 4) dragMoved = true;
      if (dragMoved) {
        if (panMode) {
          const basis = getCameraBasis();
          const scale = state.cam.dist * 0.0014;
          state.cam.tx -= (basis.right[0] * dx - basis.up[0] * dy) * scale;
          state.cam.ty -= (basis.right[1] * dx - basis.up[1] * dy) * scale;
          state.cam.tz -= (basis.right[2] * dx - basis.up[2] * dy) * scale;
          state.cam.ty = Math.max(-2, Math.min(16, state.cam.ty));
        } else {
          state.cam.yaw -= dx * 0.0085;
          state.cam.pitch = Math.max(0.08, Math.min(1.48, state.cam.pitch + dy * 0.0085));
        }
        state.hoverPlacement = null; state.hoverBrickId = null;
      }
      lastX = e.clientX; lastY = e.clientY;
      return;
    }

    if (state.isPlaying) return;
    const hit = raycastScene(e.clientX, e.clientY);
    if (state.mode === 'build') {
      state.hoverBrickId = null;
      state.hoverPlacement = state.visibleStep === state.bricks.length ? computePlacementFromHit(hit) : null;
    } else {
      state.hoverPlacement = null;
      state.hoverBrickId = hit && hit.brick ? hit.brick.id : null;
    }
    updateHUD();
  });

  canvas.addEventListener('pointerup', e => {
    const wasClick = pointerDown && !dragMoved && dragButton === 0;
    pointerDown = false;
    if (!wasClick) return;
    if (state.isPlaying) { stopPlayback(); return; }
    if (state.visibleStep < state.bricks.length) {
      setVisibleStep(state.bricks.length, false);
      showToast('전체 모델로 전환되었습니다. 다시 클릭해 편집하세요.');
      return;
    }

    const hit = raycastScene(e.clientX, e.clientY);
    if (state.mode === 'build') {
      const pl = computePlacementFromHit(hit);
      if (pl && pl.valid) {
        pushUndo();
        const brick = makeBrick(state.selectedType, pl.x, pl.y, pl.z, state.rotation, state.selectedColor, state.selectedAlpha, state.selectedMetal);
        state.bricks.push(brick);
        state.visibleStep = state.bricks.length;
        state.animatingStepIndex = state.bricks.length - 1;
        state.dropProgress = state.dropAnimEnabled ? 0.35 : 1.0;
        state.selectedStepIdx = null;
        syncUI();
      }
    } else if (state.mode === 'paint') {
      if (hit && hit.brick) {
        pushUndo();
        hit.brick.color = state.selectedColor;
        hit.brick.alpha = state.selectedAlpha;
        hit.brick.metal = state.selectedMetal;
        syncUI();
      }
    } else if (state.mode === 'delete') {
      if (hit && hit.brick) {
        pushUndo();
        const idx = state.bricks.findIndex(b => b.id === hit.brick.id);
        if (idx !== -1) state.bricks.splice(idx, 1);
        state.visibleStep = state.bricks.length;
        state.hoverBrickId = null;
        state.selectedStepIdx = null;
        syncUI();
      }
    }
  });

  canvas.addEventListener('pointerleave', () => { state.hoverPlacement = null; state.hoverBrickId = null; });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    state.cam.dist = Math.max(7, Math.min(48, state.cam.dist * (e.deltaY > 0 ? 1.09 : 0.92)));
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault(); if (e.shiftKey) redo(); else undo(); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    const k = e.key.toLowerCase();
    if (k === 'r') { state.rotation = (state.rotation + 1) % 4; updateHUD(); }
    else if (k === '1') setMode('build');
    else if (k === '2') setMode('paint');
    else if (k === '3') setMode('delete');
    else if (e.code === 'Space') { e.preventDefault(); togglePlayback(); }
    else if (e.key === 'ArrowLeft') { stopPlayback(); setVisibleStep(state.visibleStep - 1, false); }
    else if (e.key === 'ArrowRight') { stopPlayback(); setVisibleStep(state.visibleStep + 1, true); }
    else if (e.key === 'Escape') $('gif-modal').classList.add('hidden');
  });

  // =========================================================================
  // 9. BUTTON & FILTER EVENT WIRING
  // =========================================================================
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.selectedCat = btn.dataset.cat;
      renderBrickLibrary();
    });
  });

  $('brick-search').addEventListener('input', e => {
    state.searchQuery = e.target.value;
    renderBrickLibrary();
  });

  document.querySelectorAll('.mode-btn').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
  $('btn-rotate').addEventListener('click', () => { state.rotation = (state.rotation + 1) % 4; updateHUD(); });
  $('btn-undo').addEventListener('click', undo);
  $('btn-redo').addEventListener('click', redo);

  $('preset-select').addEventListener('change', e => {
    stopPlayback(); pushUndo();
    state.bricks = buildPresetModel(e.target.value);
    state.visibleStep = state.bricks.length;
    state.selectedStepIdx = null;
    fitCameraToModel(); syncUI();
    showToast('모델을 불러왔습니다');
  });

  $('btn-clear-all').addEventListener('click', () => {
    if (!state.bricks.length) return;
    stopPlayback(); pushUndo();
    state.bricks = []; state.visibleStep = 0; state.selectedStepIdx = null;
    syncUI(); showToast('베이스판을 비웠습니다');
  });

  $('btn-sort-layers').addEventListener('click', () => {
    if (state.bricks.length < 2) return;
    stopPlayback(); pushUndo();
    state.bricks = sortBricksBottomUp(state.bricks);
    state.visibleStep = state.bricks.length;
    syncUI(); showToast('바닥부터 위층 순으로 정렬했습니다');
  });

  function fitCameraToModel(targetCam = state.cam) {
    if (!state.bricks.length) {
      targetCam.yaw = 0.68; targetCam.pitch = 0.54; targetCam.dist = 22.5;
      targetCam.tx = 0; targetCam.ty = 1.4; targetCam.tz = 0;
      return;
    }
    let minX = 16, maxX = 0, minZ = 16, maxZ = 0, maxY = 0;
    state.bricks.forEach(b => {
      const d = getBrickDims(b.type, b.rot);
      if (b.x < minX) minX = b.x;
      if (b.x + d.w > maxX) maxX = b.x + d.w;
      if (b.z < minZ) minZ = b.z;
      if (b.z + d.d > maxZ) maxZ = b.z + d.d;
      if ((b.y + d.h) * PLATE_H > maxY) maxY = (b.y + d.h) * PLATE_H;
    });
    targetCam.tx = ((minX + maxX) * 0.5) - GRID_SIZE * 0.5;
    targetCam.tz = ((minZ + maxZ) * 0.5) - GRID_SIZE * 0.5;
    targetCam.ty = Math.max(1.2, maxY * 0.42);
    const span = Math.max(maxX - minX, maxZ - minZ, maxY * 1.35, 8);
    targetCam.dist = Math.max(15, Math.min(34, span * 2.05));
    targetCam.yaw = 0.68;
    targetCam.pitch = 0.52;
  }

  document.querySelectorAll('.cam-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = btn.dataset.cam;
      if (c === 'iso') fitCameraToModel();
      else if (c === 'front') { state.cam.yaw = 0; state.cam.pitch = 0.24; }
      else if (c === 'top') { state.cam.yaw = 0; state.cam.pitch = 1.45; }
    });
  });
  $('btn-zoom-in').addEventListener('click', () => { state.cam.dist = Math.max(7, state.cam.dist * 0.85); });
  $('btn-zoom-out').addEventListener('click', () => { state.cam.dist = Math.min(48, state.cam.dist * 1.18); });

  $('btn-step-start').addEventListener('click', () => { stopPlayback(); setVisibleStep(0, false); });
  $('btn-step-prev').addEventListener('click', () => { stopPlayback(); setVisibleStep(state.visibleStep - 1, false); });
  $('btn-play-pause').addEventListener('click', togglePlayback);
  $('btn-step-next').addEventListener('click', () => { stopPlayback(); setVisibleStep(state.visibleStep + 1, true); });
  $('btn-step-end').addEventListener('click', () => { stopPlayback(); setVisibleStep(state.bricks.length, false); state.selectedStepIdx = null; renderStepList(); });
  $('btn-exit-preview').addEventListener('click', () => { stopPlayback(); setVisibleStep(state.bricks.length, false); state.selectedStepIdx = null; renderStepList(); });

  $('step-slider').addEventListener('input', e => {
    stopPlayback();
    const val = parseInt(e.target.value, 10);
    setVisibleStep(val, val > state.visibleStep);
  });
  $('chk-drop-anim').addEventListener('change', e => { state.dropAnimEnabled = e.target.checked; });
  $('play-speed').addEventListener('change', e => { state.playSpeedMs = parseInt(e.target.value, 10); });

  $('btn-save-json').addEventListener('click', () => {
    const payload = JSON.stringify({ app: 'BrickCraft3D', version: 2, baseplateColor: state.baseplateColor, bricks: state.bricks }, null, 2);
    const blob = new Blob([payload], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'brickcraft-model.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    showToast('모델 JSON이 저장되었습니다');
  });

  $('btn-load-json').addEventListener('click', () => $('file-load-input').click());
  $('file-load-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.bricks)) throw new Error('invalid');
        pushUndo();
        state.bricks = data.bricks
          .filter(b => BRICK_DEFS[b.type])
          .map(b => makeBrick(b.type, b.x | 0, b.y | 0, b.z | 0, b.rot | 0, b.color || '#D01012', b.alpha ?? null, b.metal ?? null));
        if (data.baseplateColor) state.baseplateColor = data.baseplateColor;
        state.visibleStep = state.bricks.length;
        fitCameraToModel(); syncUI();
        showToast(`${state.bricks.length}개 브릭을 불러왔습니다`);
      } catch { showToast('올바른 모델 JSON 파일이 아닙니다'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // =========================================================================
  // 10. GIF EXPORT STUDIO WORKFLOW
  // =========================================================================
  let currentGifUrl = null, isExporting = false;

  $('btn-open-gif').addEventListener('click', () => { stopPlayback(); $('gif-modal').classList.remove('hidden'); });
  $('btn-close-gif').addEventListener('click', () => { if (!isExporting) $('gif-modal').classList.add('hidden'); });
  $('gif-modal').addEventListener('click', e => { if (e.target === $('gif-modal') && !isExporting) $('gif-modal').classList.add('hidden'); });
  $('gif-speed').addEventListener('input', e => { $('gif-speed-val').textContent = `${e.target.value} ms`; });

  function drawGifOverlay(ctx, w, h, step, total, labelText) {
    const pad = Math.round(w * 0.025);
    const barH = Math.max(6, Math.round(h * 0.016));
    const fontSize = Math.max(12, Math.round(w * 0.024));
    ctx.save();
    ctx.font = `700 ${fontSize}px system-ui, -apple-system, sans-serif`;
    const text = labelText || `STEP ${step} / ${total}`;
    const pillW = ctx.measureText(text).width + pad * 1.6;
    const pillH = fontSize + pad * 0.9;

    ctx.fillStyle = state.isDark ? 'rgba(24, 24, 28, 0.82)' : 'rgba(255, 255, 255, 0.88)';
    ctx.beginPath(); ctx.roundRect(pad, pad, pillW, pillH, 8); ctx.fill();
    ctx.strokeStyle = state.isDark ? 'rgba(255,255,255,0.16)' : 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 1; ctx.stroke();

    ctx.fillStyle = state.isDark ? '#F5F5F7' : '#18181B';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, pad + pad * 0.8, pad + pillH * 0.52);

    const progW = w - pad * 2, progY = h - pad - barH;
    ctx.fillStyle = state.isDark ? 'rgba(255,255,255,0.16)' : 'rgba(0,0,0,0.14)';
    ctx.beginPath(); ctx.roundRect(pad, progY, progW, barH, barH / 2); ctx.fill();

    const ratio = total > 0 ? Math.min(1, step / total) : 1;
    if (ratio > 0) {
      ctx.fillStyle = '#E3000B';
      ctx.beginPath(); ctx.roundRect(pad, progY, Math.max(barH, progW * ratio), barH, barH / 2); ctx.fill();
    }
    ctx.restore();
  }

  $('btn-generate-gif').addEventListener('click', async () => {
    if (isExporting) return;
    if (state.bricks.length === 0) { showToast('내보낼 브릭이 없습니다. 먼저 브릭을 배치해주세요!'); return; }

    isExporting = true;
    const genBtn = $('btn-generate-gif');
    genBtn.disabled = true;
    $('gif-progress-wrap').classList.remove('hidden');
    $('gif-progress-bar').style.width = '0%';
    $('gif-progress-pct').textContent = '0%';
    $('gif-progress-label').textContent = '3D 프레임 렌더링 준비 중...';

    const [expW, expH] = $('gif-res').value.split('x').map(Number);
    const style = $('gif-style').value;
    const orderMode = $('gif-order').value;
    const stepMs = parseInt($('gif-speed').value, 10);
    const showHud = $('gif-hud').checked;
    const autoIso = $('gif-iso-cam').checked;

    const exportBricks = orderMode === 'layer' ? sortBricksBottomUp(state.bricks) : [...state.bricks];
    const total = exportBricks.length;
    const expCam = { ...state.cam };
    if (autoIso) fitCameraToModel(expCam);

    const compCanvas = document.createElement('canvas');
    compCanvas.width = expW; compCanvas.height = expH;
    const ctx2d = compCanvas.getContext('2d', { willReadFrequently: true });
    const origW = canvas.width, origH = canvas.height;
    const frames = [];

    const captureFrame = (stepCount, animIdx, dropProg, delayMs, camObj, labelText) => {
      renderScene({ width: expW, height: expH, cam: camObj, bricks: exportBricks, stepCount, animIdx, dropProg, showGhost: false, noHighlight: true });
      ctx2d.drawImage(canvas, 0, 0, expW, expH);
      if (showHud) drawGifOverlay(ctx2d, expW, expH, stepCount, total, labelText);
      frames.push({ rgba: new Uint8ClampedArray(ctx2d.getImageData(0, 0, expW, expH).data), delayMs });
    };

    try {
      canvas.width = expW; canvas.height = expH;
      const dropSubFrames = style === 'snap' ? 1 : (total > 45 ? 3 : 4);
      const turntableFrames = style === 'turntable' ? 24 : 0;
      const totalRenderOps = 1 + total * dropSubFrames + turntableFrames;
      let doneOps = 0;

      const updateRenderProgress = (msg) => {
        const pct = Math.round((doneOps / totalRenderOps) * 52);
        $('gif-progress-bar').style.width = `${pct}%`;
        $('gif-progress-pct').textContent = `${pct}%`;
        $('gif-progress-label').textContent = msg;
      };

      captureFrame(0, -1, 1.0, Math.min(450, stepMs + 120), expCam, `STEP 0 / ${total}`);
      doneOps++;

      for (let s = 1; s <= total; s++) {
        if (dropSubFrames === 1) {
          captureFrame(s, -1, 1.0, stepMs, expCam);
          doneOps++;
        } else {
          const subDelay = Math.max(30, Math.round((stepMs * 0.55) / (dropSubFrames - 1)));
          const restDelay = Math.max(50, Math.round(stepMs * 0.45));
          for (let k = 1; k <= dropSubFrames; k++) {
            captureFrame(s, s - 1, k / dropSubFrames, k === dropSubFrames ? restDelay : subDelay, expCam);
            doneOps++;
          }
        }
        if (s % 2 === 0 || s === total) {
          updateRenderProgress(`단계 렌더링 중 (${s}/${total})...`);
          await new Promise(r => setTimeout(r, 0));
        }
      }

      if (turntableFrames > 0) {
        const baseYaw = expCam.yaw;
        for (let t = 1; t <= turntableFrames; t++) {
          captureFrame(total, -1, 1.0, 70, { ...expCam, yaw: baseYaw + (t / turntableFrames) * Math.PI * 2 }, 'COMPLETE!');
          doneOps++;
          if (t % 4 === 0) {
            updateRenderProgress(`360° 완성 회전 렌더링 (${t}/${turntableFrames})...`);
            await new Promise(r => setTimeout(r, 0));
          }
        }
      } else {
        frames[frames.length - 1].delayMs = 1500;
      }

      canvas.width = origW; canvas.height = origH;

      const blob = await GIFEncoder.encode(expW, expH, frames, (frac, label) => {
        const pct = Math.round(frac * 100);
        $('gif-progress-bar').style.width = `${pct}%`;
        $('gif-progress-pct').textContent = `${pct}%`;
        $('gif-progress-label').textContent = label;
      });

      if (currentGifUrl) URL.revokeObjectURL(currentGifUrl);
      currentGifUrl = URL.createObjectURL(blob);

      const totalSec = (frames.reduce((s, f) => s + f.delayMs, 0) / 1000).toFixed(1);
      const sizeStr = blob.size >= 1024 * 1024 ? `${(blob.size / (1024 * 1024)).toFixed(2)} MB` : `${Math.round(blob.size / 1024)} KB`;

      $('gif-placeholder').classList.add('hidden');
      const img = $('gif-preview-img');
      img.src = currentGifUrl;
      img.classList.remove('hidden');
      $('gif-download-bar').classList.remove('hidden');
      $('gif-download-link').href = currentGifUrl;
      $('gif-download-link').download = `brickcraft-${$('preset-select').value}-${expW}x${expH}.gif`;
      $('gif-size-badge').textContent = `${sizeStr} · ${frames.length}프레임 · ${totalSec}초`;
      $('gif-meta').textContent = `${expW}×${expH}`;
      $('gif-progress-bar').style.width = '100%';
      $('gif-progress-pct').textContent = '100%';
      $('gif-progress-label').textContent = 'GIF 생성 완료!';
      showToast(`GIF 생성 완료 (${sizeStr})`);
    } catch (err) {
      console.error(err);
      showToast('GIF 생성 중 오류가 발생했습니다');
    } finally {
      canvas.width = origW; canvas.height = origH;
      isExporting = false;
      genBtn.disabled = false;
    }
  });

  // =========================================================================
  // 11. THEME SYNC, RESIZE & MAIN LOOP
  // =========================================================================
  function parseCssColorToRgb01(str) {
    const m = str && str.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    return m ? [parseInt(m[1], 10) / 255, parseInt(m[2], 10) / 255, parseInt(m[3], 10) / 255] : null;
  }

  function syncTheme() {
    const isLightClass = document.documentElement.classList.contains('light');
    const parsed = parseCssColorToRgb01(getComputedStyle(document.body).backgroundColor);
    if (parsed) {
      const lum = parsed[0] * 0.299 + parsed[1] * 0.587 + parsed[2] * 0.114;
      state.isDark = lum < 0.45 && !isLightClass;
      state.bgRgb = state.isDark
        ? [Math.min(1, parsed[0] * 0.92 + 0.03), Math.min(1, parsed[1] * 0.92 + 0.035), Math.min(1, parsed[2] * 0.94 + 0.045)]
        : [Math.max(0, parsed[0] * 0.955), Math.max(0, parsed[1] * 0.962), Math.max(0, parsed[2] * 0.975)];
    } else {
      state.isDark = !isLightClass;
      state.bgRgb = state.isDark ? [0.12, 0.13, 0.15] : [0.93, 0.95, 0.97];
    }
  }

  window.addEventListener('themechange', syncTheme);

  function resizeCanvas() {
    if (isExporting) return;
    const wrap = $('viewport-wrap');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.floor(wrap.clientWidth * dpr));
    const h = Math.max(1, Math.floor(wrap.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }
  new ResizeObserver(resizeCanvas).observe($('viewport-wrap'));

  let lastTime = performance.now();
  function frameLoop(now) {
    const dt = Math.min(80, now - lastTime);
    lastTime = now;
    if (!isExporting) {
      if (state.dropProgress < 1.0) {
        state.dropProgress = Math.min(1.0, state.dropProgress + dt / Math.min(260, state.playSpeedMs * 0.85));
        if (state.dropProgress >= 1.0) state.animatingStepIndex = -1;
      }
      if (state.isPlaying) {
        state.playTimer += dt;
        if (state.playTimer >= state.playSpeedMs) {
          state.playTimer = 0;
          if (state.visibleStep < state.bricks.length) setVisibleStep(state.visibleStep + 1, true);
          else stopPlayback();
        }
      }
      resizeCanvas();
      renderScene();
    }
    requestAnimationFrame(frameLoop);
  }

  // =========================================================================
  // 12. BOOTSTRAP
  // =========================================================================
  // Standalone theme init & toggle
  const savedTheme = localStorage.getItem("brickcraft-theme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const initDark = savedTheme ? savedTheme === "dark" : prefersDark;
  document.documentElement.classList.toggle("dark", initDark);
  document.documentElement.classList.toggle("light", !initDark);

  function updateThemeIcons() {
    const isD = document.documentElement.classList.contains("dark");
    $("icon-theme-sun").classList.toggle("hidden", !isD);
    $("icon-theme-moon").classList.toggle("hidden", isD);
  }
  updateThemeIcons();

  $("btn-toggle-theme").addEventListener("click", () => {
    const nextDark = !document.documentElement.classList.contains("dark");
    document.documentElement.classList.toggle("dark", nextDark);
    document.documentElement.classList.toggle("light", !nextDark);
    localStorage.setItem("brickcraft-theme", nextDark ? "dark" : "light");
    updateThemeIcons();
    syncTheme();
  });

  syncTheme();
  state.bricks = buildPresetModel('house');
  state.visibleStep = state.bricks.length;
  fitCameraToModel();
  setMode('build');
  renderBrickLibrary();
  renderColorPalette();
  syncUI();
  resizeCanvas();
  requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
