<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrickCraft 3D — 전체 레고 브릭 3D 조립 & GIF 내보내기</title>
  <meta name="description" content="브라우저에서 93종의 레고 브릭으로 3D 모델을 조립하고 조립 순서를 애니메이션 GIF로 내보내는 무료 3D 레고 빌더 스튜디오" />
  <meta property="og:title" content="BrickCraft 3D — 레고 3D 조립 & GIF 내보내기" />
  <meta property="og:description" content="93종 레고 브릭 3D 조립 및 단계별 드롭 애니메이션 GIF 내보내기" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Cpath d=%27M14 3L25 8.5V19.5L14 25L3 19.5V8.5L14 3Z%27 fill=%27%23E3000B%27/%3E%3Cpath d=%27M14 3L25 8.5L14 14L3 8.5L14 3Z%27 fill=%27%23FF3B30%27/%3E%3Cpath d=%27M14 14L25 8.5V19.5L14 25V14Z%27 fill=%27%23B80009%27/%3E%3C/svg%3E" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --background: #f4f5f7;
      --content: #ffffff;
      --card: #ffffff;
      --sidebar: #f9fafb;
      --border: #e2e5ea;
      --card-border: #e2e5ea;
      --foreground: #18181b;
      --muted-foreground: #64748b;
      --primary: #e3000b;
      --primary-foreground: #ffffff;
      --accent: #eef0f4;
      --error: #dc2626;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    :root.dark {
      --background: #14161a;
      --content: #1a1d23;
      --card: #1f232b;
      --sidebar: #181b21;
      --border: #2e3440;
      --card-border: #2e3440;
      --foreground: #f1f5f9;
      --muted-foreground: #94a3b8;
      --primary: #ef233c;
      --primary-foreground: #ffffff;
      --accent: #2a303c;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .thin-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--muted-foreground) 30%, transparent);
      border-radius: 999px;
    }
    .thin-scroll::-webkit-scrollbar-thumb:hover {
      background: color-mix(in srgb, var(--muted-foreground) 55%, transparent);
    }
    .tool-btn {
      transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease, transform 100ms ease;
    }
    .tool-btn:active { transform: scale(0.97); }
    .brick-card {
      transition: background-color 140ms ease, border-color 140ms ease, transform 120ms ease;
    }
    .brick-card:hover { transform: translateY(-1px); }
    .brick-card.active {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 13%, var(--card));
    }
    .swatch-btn {
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .swatch-btn:hover { transform: scale(1.12); z-index: 2; }
    .swatch-btn.active {
      box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--primary);
      transform: scale(1.08);
      z-index: 3;
    }
    .step-row {
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    .step-row.active {
      background: color-mix(in srgb, var(--primary) 14%, transparent);
      border-color: color-mix(in srgb, var(--primary) 45%, transparent);
    }
    .step-row.future { opacity: 0.45; }
    input[type="range"] {
      accent-color: var(--primary);
    }
    #gl-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased flex flex-col h-screen w-screen overflow-hidden">

  <!-- Top Studio Header -->
  <header class="h-12 shrink-0 bg-[var(--sidebar)] border-b border-[var(--border)] px-3 flex items-center justify-between gap-2 z-20">
    <!-- Left: Brand & Preset -->
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="flex items-center gap-2 shrink-0">
        <svg class="w-6 h-6 shrink-0" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <path d="M14 3L25 8.5V19.5L14 25L3 19.5V8.5L14 3Z" fill="#E3000B"/>
          <path d="M14 3L25 8.5L14 14L3 8.5L14 3Z" fill="#FF3B30"/>
          <path d="M14 14L25 8.5V19.5L14 25V14Z" fill="#B80009"/>
          <ellipse cx="14" cy="7.2" rx="3.2" ry="1.6" fill="#FF6961"/>
          <ellipse cx="9.2" cy="9.5" rx="2.6" ry="1.3" fill="#FF6961"/>
          <ellipse cx="18.8" cy="9.5" rx="2.6" ry="1.3" fill="#FF6961"/>
        </svg>
        <span class="font-semibold text-sm tracking-tight hidden sm:inline">BrickCraft 3D</span>
      </div>

      <div class="h-5 w-px bg-[var(--border)] hidden sm:block"></div>

      <label class="flex items-center gap-1.5 text-xs text-[var(--muted-foreground)]">
        <span class="hidden md:inline">모델</span>
        <select id="preset-select" class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-md px-2 py-1 text-xs focus:outline-none focus:border-[var(--primary)] cursor-pointer">
          <option value="house">작은 집 (창문·문·울타리)</option>
          <option value="castle">중세 성 (아치·성벽·탑)</option>
          <option value="car">레이싱카 (바퀴·흙받이·앞유리)</option>
          <option value="rocket">우주 로켓 (콘·레이더·테크닉)</option>
          <option value="duck">클래식 레고 오리</option>
          <option value="empty">빈 베이스플레이트</option>
        </select>
      </label>
    </div>

    <!-- Center: Modes & Edit Actions -->
    <div class="flex items-center gap-1.5">
      <div class="flex items-center bg-[var(--card)] border border-[var(--border)] rounded-lg p-0.5" role="group" aria-label="편집 도구">
        <button data-mode="build" class="mode-btn tool-btn px-2.5 py-1 rounded-md text-xs font-medium flex items-center gap-1 cursor-pointer" title="브릭 배치 (1)">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>놓기</span>
        </button>
        <button data-mode="paint" class="mode-btn tool-btn px-2.5 py-1 rounded-md text-xs font-medium flex items-center gap-1 cursor-pointer" title="브릭 색칠 (2)">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 11l-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11z"/><path d="M5 2l5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4z"/></svg>
          <span>색칠</span>
        </button>
        <button data-mode="delete" class="mode-btn tool-btn px-2.5 py-1 rounded-md text-xs font-medium flex items-center gap-1 cursor-pointer" title="브릭 삭제 (3)">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
          <span>삭제</span>
        </button>
      </div>

      <button id="btn-rotate" class="tool-btn bg-[var(--card)] hover:bg-[var(--accent)] border border-[var(--border)] rounded-md px-2 py-1 text-xs flex items-center gap-1 cursor-pointer" title="브릭 90° 회전 (R)">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        <span class="hidden lg:inline">회전</span>
        <kbd class="text-[10px] text-[var(--muted-foreground)] font-mono">R</kbd>
      </button>

      <div class="flex items-center bg-[var(--card)] border border-[var(--border)] rounded-md overflow-hidden">
        <button id="btn-undo" class="tool-btn px-2 py-1 text-xs hover:bg-[var(--accent)] disabled:opacity-35 cursor-pointer" title="실행취소 (Ctrl+Z)">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
        <div class="w-px h-4 bg-[var(--border)]"></div>
        <button id="btn-redo" class="tool-btn px-2 py-1 text-xs hover:bg-[var(--accent)] disabled:opacity-35 cursor-pointer" title="다시실행 (Ctrl+Y)">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
        </button>
      </div>
    </div>

    <!-- Right: Save/Load & GIF Export -->
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btn-save-json" class="tool-btn bg-[var(--card)] hover:bg-[var(--accent)] border border-[var(--border)] rounded-md px-2 py-1 text-xs cursor-pointer hidden md:flex items-center gap-1" title="모델 JSON 저장">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span>저장</span>
      </button>
      <button id="btn-load-json" class="tool-btn bg-[var(--card)] hover:bg-[var(--accent)] border border-[var(--border)] rounded-md px-2 py-1 text-xs cursor-pointer hidden md:flex items-center gap-1" title="모델 JSON 불러오기">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>열기</span>
      </button>
      <input id="file-load-input" type="file" accept=".json" class="hidden" />

      <button id="btn-toggle-theme" class="tool-btn bg-[var(--card)] hover:bg-[var(--accent)] border border-[var(--border)] rounded-md w-7 h-7 flex items-center justify-center cursor-pointer" title="라이트/다크 테마 전환" aria-label="테마 전환">
        <svg id="icon-theme-sun" class="w-3.5 h-3.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg id="icon-theme-moon" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>

      <button id="btn-open-gif" class="tool-btn bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 rounded-md px-3 py-1.5 text-xs font-semibold flex items-center gap-1.5 cursor-pointer shadow-sm">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="4" width="20" height="16" rx="2"/><polygon points="10 9 16 12 10 15 10 9" fill="currentColor"/></svg>
        <span>GIF 내보내기</span>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 flex min-h-0 overflow-hidden">

    <!-- Left Sidebar: Complete Lego Part Library & Color Palette -->
    <aside class="w-64 shrink-0 bg-[var(--sidebar)] border-r border-[var(--border)] flex flex-col min-h-0 overflow-hidden">
      <!-- Header + Search -->
      <div class="p-2.5 border-b border-[var(--border)] space-y-2 shrink-0">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-semibold tracking-wide text-[var(--foreground)]">전체 브릭 (<span id="catalog-count">0</span>종)</h2>
          <span id="selected-brick-label" class="text-xs text-[var(--primary)] font-mono font-semibold truncate max-w-[110px]">2×4</span>
        </div>
        <div class="relative">
          <input id="brick-search" type="text" placeholder="브릭 검색 (예: 아치, 바퀴, 테크닉...)" class="w-full bg-[var(--card)] text-[var(--foreground)] placeholder:text-[var(--muted-foreground)] border border-[var(--border)] rounded-md pl-7 pr-2 py-1 text-xs focus:outline-none focus:border-[var(--primary)]" />
          <svg class="w-3.5 h-3.5 text-[var(--muted-foreground)] absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </div>
        <!-- 8 Category Filter Grid -->
        <div id="cat-tabs" class="grid grid-cols-4 gap-1 text-xs">
          <button data-cat="all" class="cat-btn py-1 rounded text-center font-medium cursor-pointer">전체</button>
          <button data-cat="brick" class="cat-btn py-1 rounded text-center font-medium cursor-pointer">브릭</button>
          <button data-cat="plate" class="cat-btn py-1 rounded text-center font-medium cursor-pointer">플레이트</button>
          <button data-cat="tile" class="cat-btn py-1 rounded text-center font-medium cursor-pointer">타일</button>
          <button data-cat="slope" class="cat-btn py-1 rounded text-center font-medium cursor-pointer">슬로프</button>
          <button data-cat="arch" class="cat-btn py-1 rounded text-center font-medium cursor-pointer">아치·건축</button>
          <button data-cat="technic" class="cat-btn py-1 rounded text-center font-medium cursor-pointer">테크닉</button>
          <button data-cat="vehicle" class="cat-btn py-1 rounded text-center font-medium cursor-pointer">차량·자연</button>
        </div>
      </div>

      <!-- Scrollable Brick Grid -->
      <div class="flex-1 overflow-y-auto thin-scroll p-2">
        <div id="brick-grid" class="grid grid-cols-2 gap-1.5"></div>
      </div>

      <!-- Bottom Fixed Color & Baseplate Section -->
      <div class="shrink-0 p-2.5 border-t border-[var(--border)] bg-[var(--sidebar)] space-y-2">
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-semibold text-[var(--foreground)]">색상 (24종)</span>
            <span id="selected-color-name" class="text-xs text-[var(--muted-foreground)] truncate max-w-[130px]">브라이트 레드</span>
          </div>
          <div id="color-grid" class="grid grid-cols-8 gap-1"></div>
        </div>
        <div class="pt-1.5 border-t border-[var(--border)] flex items-center justify-between">
          <div class="flex items-center gap-1.5">
            <span class="text-xs text-[var(--muted-foreground)]">판</span>
            <div id="baseplate-colors" class="flex items-center gap-1"></div>
          </div>
          <button id="btn-clear-all" class="text-xs text-[var(--muted-foreground)] hover:text-[var(--error)] cursor-pointer">비우기</button>
        </div>
      </div>
    </aside>

    <!-- Center: 3D Viewport + Bottom Timeline -->
    <main class="flex-1 flex flex-col min-w-0 min-h-0 relative">
      <!-- 3D Canvas Container -->
      <div id="viewport-wrap" class="flex-1 relative min-h-0 overflow-hidden">
        <canvas id="gl-canvas"></canvas>

        <!-- Top-Left HUD Badge -->
        <div class="absolute top-3 left-3 pointer-events-none flex items-center gap-2">
          <div class="bg-[var(--card)]/90 backdrop-blur-sm border border-[var(--border)] rounded-lg px-2.5 py-1.5 text-xs flex items-center gap-2 shadow-sm">
            <span id="hud-color-dot" class="w-3 h-3 rounded-sm border border-black/20 inline-block"></span>
            <span id="hud-tool-info" class="font-medium">2×4 브릭</span>
            <span class="text-[var(--border)]">|</span>
            <span id="hud-coords" class="font-mono text-[var(--muted-foreground)] tabular-nums">X:- Y:- Z:-</span>
            <span class="text-[var(--border)]">|</span>
            <span id="hud-count" class="font-mono tabular-nums text-[var(--muted-foreground)]">0 브릭</span>
          </div>
        </div>

        <!-- Top-Right Playback Banner -->
        <div id="preview-mode-banner" class="hidden absolute top-3 right-3 bg-[var(--card)]/95 backdrop-blur-sm border border-[var(--primary)] rounded-lg px-3 py-1.5 text-xs flex items-center gap-2 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-[var(--primary)]"></span>
          <span id="preview-mode-text" class="font-medium">조립 단계 미리보기 중</span>
          <button id="btn-exit-preview" class="text-[var(--primary)] font-semibold hover:underline ml-1 cursor-pointer">전체 보기</button>
        </div>

        <!-- Bottom-Left Camera Preset Controls -->
        <div class="absolute bottom-3 left-3 flex items-center gap-1 bg-[var(--card)]/90 backdrop-blur-sm border border-[var(--border)] rounded-lg p-1 shadow-sm">
          <button data-cam="iso" class="cam-btn tool-btn px-2 py-1 rounded text-xs hover:bg-[var(--accent)] cursor-pointer" title="아이소메트릭 시점">입체</button>
          <button data-cam="front" class="cam-btn tool-btn px-2 py-1 rounded text-xs hover:bg-[var(--accent)] cursor-pointer" title="정면 시점">정면</button>
          <button data-cam="top" class="cam-btn tool-btn px-2 py-1 rounded text-xs hover:bg-[var(--accent)] cursor-pointer" title="상단 시점">위</button>
          <div class="w-px h-3.5 bg-[var(--border)] mx-0.5"></div>
          <button id="btn-zoom-in" class="tool-btn w-6 h-6 rounded flex items-center justify-center hover:bg-[var(--accent)] text-xs font-bold cursor-pointer" title="확대">+</button>
          <button id="btn-zoom-out" class="tool-btn w-6 h-6 rounded flex items-center justify-center hover:bg-[var(--accent)] text-xs font-bold cursor-pointer" title="축소">−</button>
        </div>

        <!-- Bottom-Right Controls Hint -->
        <div class="absolute bottom-3 right-3 hidden xl:flex items-center gap-2 bg-[var(--card)]/80 backdrop-blur-sm border border-[var(--border)] rounded-lg px-2.5 py-1 text-xs text-[var(--muted-foreground)] pointer-events-none">
          <span>클릭: 배치</span>
          <span>·</span>
          <span>드래그: 회전</span>
          <span>·</span>
          <span>Shift+드래그: 이동</span>
          <span>·</span>
          <span>R: 회전</span>
          <span>·</span>
          <span>Space: 재생</span>
        </div>
      </div>

      <!-- Bottom Assembly Timeline Bar -->
      <section class="shrink-0 bg-[var(--sidebar)] border-t border-[var(--border)] px-3 py-2 flex items-center gap-3 flex-wrap">
        <div class="flex items-center gap-1">
          <button id="btn-step-start" class="tool-btn w-7 h-7 rounded-md bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--accent)] flex items-center justify-center cursor-pointer" title="처음으로">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button id="btn-step-prev" class="tool-btn w-7 h-7 rounded-md bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--accent)] flex items-center justify-center cursor-pointer" title="이전 단계 (←)">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <button id="btn-play-pause" class="tool-btn w-8 h-7 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 flex items-center justify-center cursor-pointer" title="조립 순서 재생/일시정지 (Space)">
            <svg id="icon-play" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
            <svg id="icon-pause" class="w-3.5 h-3.5 hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button id="btn-step-next" class="tool-btn w-7 h-7 rounded-md bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--accent)] flex items-center justify-center cursor-pointer" title="다음 단계 (→)">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          </button>
          <button id="btn-step-end" class="tool-btn w-7 h-7 rounded-md bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--accent)] flex items-center justify-center cursor-pointer" title="완성 보기">

  function getBrickDims(type, rot) {
    const def = BRICK_DEFS[type];
    const swap = (rot & 1) === 1;
    return { w: swap ? def.d : def.w, d: swap ? def.w : def.d, h: def.h };
  }

  // Return exact occupied grid cells (supports L-shaped corner bricks cleanly!)
  function getBrickOccupiedCells(brick) {
    const def = BRICK_DEFS[brick.type];
    const rot = ((brick.rot || 0) % 4 + 4) % 4;
    if (!def.cells) return null; // full rectangular footprint
    const W = def.w, D = def.d;
    return def.cells.map(([ix, iz]) => {
      let rx, rz;
      if (rot === 0) { rx = ix; rz = iz; }
      else if (rot === 1) { rx = iz; rz = (W - 1) - ix; }
      else if (rot === 2) { rx = (W - 1) - ix; rz = (D - 1) - iz; }
      else { rx = (D - 1) - iz; rz = ix; }
      return [brick.x + rx, brick.z + rz];
    });
  }

  function makeBrick(type, x, y, z, rot, hex, alpha = null, metal = null) {
    const colorObj = LEGO_COLORS.find(c => c.hex.toLowerCase() === hex.toLowerCase());
    return {
      id: nextBrickId++,
      type,
      x, y, z,
      rot: ((rot || 0) % 4 + 4) % 4,
      color: hex,
      alpha: alpha !== null ? alpha : (colorObj ? colorObj.alpha : 1.0),
      metal: metal !== null ? metal : (colorObj ? colorObj.metal : 0),
    };
  }

      add('brick_2x6', 5, 7, 6, 0, '#F5CD2F');
      add('tile_1x4', 6, 10, 6, 0, '#F4F4F4');
      add('plate_1x4', 6, 10, 7, 0, '#F5CD2F');
      add('brick_2x4', 6, 11, 6, 0, '#F5CD2F');
      add('curve_2x2', 4, 10, 6, 3, '#F5CD2F');
      add('brick_2x2', 9, 14, 6, 0, '#F5CD2F');
      add('brick_2x3', 9, 17, 6, 0, '#F5CD2F');
      add('snot_1x1_1', 10, 20, 6, 2, '#1B2A34');
      add('snot_1x1_1', 10, 20, 7, 0, '#1B2A34');
      add('brick_1x2', 9, 20, 6, 1, '#F5CD2F');
      add('brick_1x2', 11, 20, 6, 1, '#F5CD2F');
      add('curve_2x2', 9, 23, 6, 1, '#F5CD2F');
      add('plate_2x2', 12, 18, 6, 0, '#FE8A18');
      add('cheese_1x2', 12, 19, 6, 1, '#FE8A18');
    } else {
      state.baseplateColor = '#2E8B47';
    }
    return list;
  }

  // =========================================================================
  // 3. CELL-ACCURATE COLLISION, PLACEMENT & UNDO/REDO
  // =========================================================================
  function bricksOverlap(a, b) {
    const da = getBrickDims(a.type, a.rot);
    const db = getBrickDims(b.type, b.rot);
    // Fast AABB rejection
    if (
      a.x >= b.x + db.w || a.x + da.w <= b.x ||
      a.y >= b.y + db.h || a.y + da.h <= b.y ||
      a.z >= b.z + db.d || a.z + da.d <= b.z
    ) return false;

    const ca = getBrickOccupiedCells(a);
    const cb = getBrickOccupiedCells(b);
    if (!ca && !cb) return true;

    const cellsA = ca || (() => {
      const r = [];
      for (let x = a.x; x < a.x + da.w; x++)
        for (let z = a.z; z < a.z + da.d; z++) r.push([x, z]);
      return r;
    })();
    const cellsB = cb || (() => {
      const r = [];
      for (let x = b.x; x < b.x + db.w; x++)
        for (let z = b.z; z < b.z + db.d; z++) r.push([x, z]);
      return r;
    })();

    for (let i = 0; i < cellsA.length; i++) {
      for (let j = 0; j < cellsB.length; j++) {
        if (cellsA[i][0] === cellsB[j][0] && cellsA[i][1] === cellsB[j][1]) return true;
      }
    }
    return false;
  }

  function hasCollision(candidate, ignoreId = -1) {
    const visible = getVisibleBricks();
    for (let i = 0; i < visible.length; i++) {
      if (visible[i].id === ignoreId) continue;
      if (bricksOverlap(candidate, visible[i])) return true;
    }
    return false;
  }

  function getVisibleBricks() {
    return state.bricks.slice(0, state.visibleStep);
  }

  function pushUndo() {
    state.undoStack.push(JSON.stringify(state.bricks));
    if (state.undoStack.length > 60) state.undoStack.shift();
    state.redoStack.length = 0;
    updateUndoButtons();
  }

  function undo() {
    if (!state.undoStack.length) return;
    state.redoStack.push(JSON.stringify(state.bricks));
    state.bricks = JSON.parse(state.undoStack.pop());
    state.visibleStep = state.bricks.length;
    stopPlayback();
    syncUI();
    showToast('실행취소됨');
  }

  function redo() {
    if (!state.redoStack.length) return;
    state.undoStack.push(JSON.stringify(state.bricks));
    state.bricks = JSON.parse(state.redoStack.pop());
    state.visibleStep = state.bricks.length;
    stopPlayback();
    syncUI();
    showToast('다시실행됨');
  }

  function sortBricksBottomUp(bricksArr) {
    return [...bricksArr].sort((a, b) => {
      if (a.y !== b.y) return a.y - b.y;
      if (a.z !== b.z) return a.z - b.z;
      return a.x - b.x;
    });
  }

  // =========================================================================
  // 4. WEBGL 3D ENGINE + PROCEDURAL GEOMETRY FOR ALL 78 LEGO PART TYPES
  // =========================================================================
  const canvas = document.getElementById('gl-canvas');
  const gl = canvas.getContext('webgl', {
    antialias: true,
    alpha: false,
    preserveDrawingBuffer: true,
  }) || canvas.getContext('experimental-webgl', {
    antialias: true,
    alpha: false,
    preserveDrawingBuffer: true,
  });

  if (!gl) {
    alert('WebGL을 초기화할 수 없습니다. WebGL을 지원하는 브라우저에서 열어주세요.');
    return;
  }

  const VS_SRC = `
    attribute vec3 aPos;
    attribute vec3 aNorm;
    attribute float aAO;

    uniform mat4 uProj;
    uniform mat4 uView;
    uniform vec3 uOffset;
    uniform float uRotY;

    varying vec3 vNorm;
    varying vec3 vWorldPos;
    varying float vAO;

    void main() {
      float c = cos(uRotY);
      float s = sin(uRotY);
      vec3 rp = vec3(aPos.x * c + aPos.z * s, aPos.y, -aPos.x * s + aPos.z * c);
      vec3 rn = vec3(aNorm.x * c + aNorm.z * s, aNorm.y, -aNorm.x * s + aNorm.z * c);
      vec3 wp = rp + uOffset;
      vWorldPos = wp;
      vNorm = normalize(rn);
      vAO = aAO;
      gl_Position = uProj * uView * vec4(wp, 1.0);
    }
  `;

  const FS_SRC = `
    precision mediump float;

    varying vec3 vNorm;
    varying vec3 vWorldPos;
    varying float vAO;

    uniform vec3 uColor;
    uniform float uAlpha;
    uniform vec3 uCamPos;
    uniform float uHighlight;
    uniform float uIsGround;
    uniform float uMetal;

    void main() {
      vec3 N = normalize(vNorm);
      vec3 V = normalize(uCamPos - vWorldPos);

      vec3 L1 = normalize(vec3(0.58, 0.88, 0.52));
      vec3 L2 = normalize(vec3(-0.65, 0.45, -0.55));
      vec3 L3 = normalize(vec3(0.15, 0.30, -0.92));

      float diff1 = max(dot(N, L1), 0.0);
      float diff2 = max(dot(N, L2), 0.0);
      float diff3 = max(dot(N, L3), 0.0);

      float hemi = N.y * 0.5 + 0.5;
      vec3 ambient = mix(vec3(0.24, 0.25, 0.28), vec3(0.42, 0.44, 0.48), hemi);

      vec3 light = ambient
                 + vec3(0.72, 0.71, 0.68) * diff1
                 + vec3(0.20, 0.23, 0.28) * diff2
                 + vec3(0.14, 0.13, 0.12) * diff3;

      vec3 H1 = normalize(L1 + V);
      float shininess = mix(54.0, 24.0, uMetal);
      float specStrength = uIsGround > 0.5 ? 0.14 : mix(0.34, 0.75, uMetal);
      float spec1 = pow(max(dot(N, H1), 0.0), shininess) * specStrength;
      vec3 H2 = normalize(L2 + V);
      float spec2 = pow(max(dot(N, H2), 0.0), 22.0) * mix(0.08, 0.28, uMetal);

      float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0) * (uIsGround > 0.5 ? 0.04 : mix(0.11, 0.28, uMetal));
      vec3 specCol = mix(vec3(1.0), uColor * 1.15 + vec3(0.2), uMetal);

      vec3 col = uColor * light * vAO + specCol * (spec1 + spec2 + fresnel);

      if (uHighlight > 0.01) {
        col = mix(col, vec3(1.0, 0.96, 0.85), uHighlight * 0.35);
      } else if (uHighlight < -0.01) {
        col = mix(col, vec3(1.0, 0.22, 0.22), (-uHighlight) * 0.50);
      }

      gl_FragColor = vec4(clamp(col, 0.0, 1.0), uAlpha);
    }
  `;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compileShader(gl.VERTEX_SHADER, VS_SRC));
  gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, FS_SRC));
  gl.linkProgram(program);
  gl.useProgram(program);

  const LOC = {
    aPos: gl.getAttribLocation(program, 'aPos'),
    aNorm: gl.getAttribLocation(program, 'aNorm'),
    aAO: gl.getAttribLocation(program, 'aAO'),
    uProj: gl.getUniformLocation(program, 'uProj'),
    uView: gl.getUniformLocation(program, 'uView'),
    uOffset: gl.getUniformLocation(program, 'uOffset'),
    uRotY: gl.getUniformLocation(program, 'uRotY'),
    uColor: gl.getUniformLocation(program, 'uColor'),
    uAlpha: gl.getUniformLocation(program, 'uAlpha'),
    uCamPos: gl.getUniformLocation(program, 'uCamPos'),
    uHighlight: gl.getUniformLocation(program, 'uHighlight'),
    uIsGround: gl.getUniformLocation(program, 'uIsGround'),
    uMetal: gl.getUniformLocation(program, 'uMetal'),
  };

  class MeshBuilder {
    constructor() { this.data = []; }

    pushTri(p0, p1, p2, n, ao0 = 1, ao1 = 1, ao2 = 1) {
      const e1x = p1[0] - p0[0], e1y = p1[1] - p0[1], e1z = p1[2] - p0[2];
      const e2x = p2[0] - p0[0], e2y = p2[1] - p0[1], e2z = p2[2] - p0[2];
      const cx = e1y * e2z - e1z * e2y;
      const cy = e1z * e2x - e1x * e2z;
      const cz = e1x * e2y - e1y * e2x;
      if (cx * n[0] + cy * n[1] + cz * n[2] < 0) {
        this._v(p0, n, ao0); this._v(p2, n, ao2); this._v(p1, n, ao1);
      } else {
        this._v(p0, n, ao0); this._v(p1, n, ao1); this._v(p2, n, ao2);
      }
    }

    pushQuad(p0, p1, p2, p3, n, ao0 = 1, ao1 = 1, ao2 = 1, ao3 = 1) {
      this.pushTri(p0, p1, p2, n, ao0, ao1, ao2);
      this.pushTri(p0, p2, p3, n, ao0, ao2, ao3);
    }

    _v(p, n, ao) {
      this.data.push(p[0], p[1], p[2], n[0], n[1], n[2], ao);
    }

    addBox(x0, y0, z0, x1, y1, z1, bottomAO = 0.84, topAO = 1.0) {
      const b = bottomAO, t = topAO;
      this.pushQuad([x0, y1, z0], [x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [0, 1, 0], t, t, t, t);
      this.pushQuad([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], [0, -1, 0], b, b, b, b);
      this.pushQuad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], [0, 0, 1], b, b, t, t);
      this.pushQuad([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], [0, 0, -1], b, b, t, t);
      this.pushQuad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [1, 0, 0], b, b, t, t);
      this.pushQuad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], [-1, 0, 0], b, b, t, t);
    }

    addFrustum(cx, y0, cz, r0, r1, h, segs = 20, baseAO = 0.80, topAO = 1.0, capBottom = false) {
      const y1 = y0 + h;
      const dr = r0 - r1;
      const nl = Math.hypot(h, dr) || 1;
      const nr = h / nl, ny = dr / nl;
      for (let i = 0; i < segs; i++) {
        const a0 = (i / segs) * Math.PI * 2;
        const a1 = ((i + 1) / segs) * Math.PI * 2;
        const c0 = Math.cos(a0), s0 = Math.sin(a0);
        const c1 = Math.cos(a1), s1 = Math.sin(a1);
        const p00 = [cx + r0 * c0, y0, cz + r0 * s0];
        const p10 = [cx + r0 * c1, y0, cz + r0 * s1];
        const p11 = [cx + r1 * c1, y1, cz + r1 * s1];
        const p01 = [cx + r1 * c0, y1, cz + r1 * s0];
        const n0 = [c0 * nr, ny, s0 * nr];
        const n1 = [c1 * nr, ny, s1 * nr];
        this._v(p00, n0, baseAO); this._v(p11, n1, topAO); this._v(p10, n1, baseAO);
        this._v(p00, n0, baseAO); this._v(p01, n0, topAO); this._v(p11, n1, topAO);
        if (r1 > 0.001) {
          this.pushTri([cx, y1, cz], p01, p11, [0, 1, 0], topAO, topAO * 0.96, topAO * 0.96);
        }
        if (capBottom && r0 > 0.001) {
          this.pushTri([cx, y0, cz], p10, p00, [0, -1, 0], baseAO, baseAO, baseAO);
        }
      }
    }

    addCylinder(cx, y0, cz, r, h, segs = 16, baseAO = 0.76, topAO = 1.0, capBottom = false) {
      this.addFrustum(cx, y0, cz, r, r, h, segs, baseAO, topAO, capBottom);
    }

    // Horizontal cylinder along any axis ('x' or 'z') for Wheels & Side SNOT Studs!
    addAxisCylinder(cx, cy, cz, r, len, axis, segs = 14, baseAO = 0.78, capBoth = true) {
      const half = len * 0.5;
      for (let i = 0; i < segs; i++) {
        const a0 = (i / segs) * Math.PI * 2;
        const a1 = ((i + 1) / segs) * Math.PI * 2;
        const c0 = Math.cos(a0), s0 = Math.sin(a0);
        const c1 = Math.cos(a1), s1 = Math.sin(a1);
        let p00, p10, p11, p01, n0, n1, capN0, capN1, cP0, cP1;
        if (axis === 'z') {
          p00 = [cx + r * c0, cy + r * s0, cz - half];
          p10 = [cx + r * c1, cy + r * s1, cz - half];
          p11 = [cx + r * c1, cy + r * s1, cz + half];
          p01 = [cx + r * c0, cy + r * s0, cz + half];
          n0 = [c0, s0, 0]; n1 = [c1, s1, 0];
          capN0 = [0, 0, -1]; capN1 = [0, 0, 1];
          cP0 = [cx, cy, cz - half]; cP1 = [cx, cy, cz + half];
        } else {
          p00 = [cx - half, cy + r * s0, cz + r * c0];
          p10 = [cx - half, cy + r * s1, cz + r * c1];
          p11 = [cx + half, cy + r * s1, cz + r * c1];
          p01 = [cx + half, cy + r * s0, cz + r * c0];
          n0 = [0, s0, c0]; n1 = [0, s1, c1];
          capN0 = [-1, 0, 0]; capN1 = [1, 0, 0];
          cP0 = [cx - half, cy, cz]; cP1 = [cx + half, cy, cz];
        }
        const midN = [(n0[0] + n1[0]) * 0.5, (n0[1] + n1[1]) * 0.5, (n0[2] + n1[2]) * 0.5];
        this.pushQuad(p00, p10, p11, p01, midN, baseAO, baseAO, 0.98, 0.98);
        if (capBoth) {
          this.pushTri(cP0, p00, p10, capN0, 0.94, 0.88, 0.88);
          this.pushTri(cP1, p01, p11, capN1, 0.98, 0.94, 0.94);
        }
      }
    }

    addStud(cx, y0, cz, segs = 12) {
      this.addCylinder(cx, y0, cz, STUD_R, STUD_H, segs, 0.74, 1.0, false);
    }

    addSideStud(cx, cy, cz, dir) {
      // dir: '+z', '-z', '+x', '-x'
      const h = STUD_H * 0.95;
      if (dir === '+z') this.addAxisCylinder(cx, cy, cz + h * 0.5, STUD_R, h, 'z', 12, 0.74);
      else if (dir === '-z') this.addAxisCylinder(cx, cy, cz - h * 0.5, STUD_R, h, 'z', 12, 0.74);
      else if (dir === '+x') this.addAxisCylinder(cx + h * 0.5, cy, cz, STUD_R, h, 'x', 12, 0.74);
      else if (dir === '-x') this.addAxisCylinder(cx - h * 0.5, cy, cz, STUD_R, h, 'x', 12, 0.74);
    }

    // Extrude a 2D polygon in (z, y) along X from x0 to x1 (for slopes, arches, curves!)
    extrudeZY(polyZY, x0, x1) {
      const n = polyZY.length;
      if (n < 3) return;
      // Fan-triangulate left & right caps (works for convex & star-shaped profiles around centroid)
      let cz = 0, cy = 0;
      for (let i = 0; i < n; i++) { cz += polyZY[i][0]; cy += polyZY[i][1]; }
      cz /= n; cy /= n;
      for (let i = 0; i < n; i++) {
        const a = polyZY[i], b = polyZY[(i + 1) % n];
        this.pushTri([x0, cy, cz], [x0, a[1], a[0]], [x0, b[1], b[0]], [-1, 0, 0], 0.94, 0.92, 0.92);
        this.pushTri([x1, cy, cz], [x1, b[1], b[0]], [x1, a[1], a[0]], [1, 0, 0], 0.94, 0.92, 0.92);
        // Perimeter quad with outward normal
        const dz = b[0] - a[0], dy = b[1] - a[1];
        const len = Math.hypot(dz, dy) || 1;
        // Normal perpendicular to (dz, dy) pointing away from centroid
        let nz = dy / len, ny = -dz / len;
        const mz = (a[0] + b[0]) * 0.5 - cz, my = (a[1] + b[1]) * 0.5 - cy;
        if (nz * mz + ny * my < 0) { nz = -nz; ny = -ny; }
        const aoA = a[1] < 0.05 ? 0.84 : 0.98;
        const aoB = b[1] < 0.05 ? 0.84 : 0.98;
        this.pushQuad([x0, a[1], a[0]], [x1, a[1], a[0]], [x1, b[1], b[0]], [x0, b[1], b[0]], [0, ny, nz], aoA, aoA, aoB, aoB);
      }
    }

    build() {
      const arr = new Float32Array(this.data);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
      return { buf, count: arr.length / 7 };
    }
  }

  // Lazy-cached procedural 3D meshes for all 78 part types
  const brickMeshes = {};
  function getBrickMesh(type) {
    if (!brickMeshes[type]) brickMeshes[type] = createBrickMesh(type);
    return brickMeshes[type];
  }

  function createBrickMesh(type) {
    const def = BRICK_DEFS[type];
    const mb = new MeshBuilder();
    const w = def.w, d = def.d, H = def.h * PLATE_H - 0.006;
    const hw = w * 0.5, hd = d * 0.5;
    const x0 = -hw + INSET, x1 = hw - INSET;
    const z0 = -hd + INSET, z1 = hd - INSET;

    const addTopStuds = (y = H) => {
      for (let ix = 0; ix < w; ix++)
        for (let iz = 0; iz < d; iz++)
          mb.addStud(-hw + ix + 0.5, y, -hd + iz + 0.5, 12);
    };

    switch (def.shape) {
      case 'box': {
        mb.addBox(x0, 0, z0, x1, H, z1);
        if (def.studs) addTopStuds();
        break;
      }

      case 'corner': {
        // L-shape occupying (0,0), (1,0), (0,1)
        mb.addBox(x0, 0, z0, x1, H, 0 - INSET);
        mb.addBox(x0, 0, 0 - INSET, 0 - INSET, H, z1);
        if (def.studs) {
          mb.addStud(-0.5, H, -0.5);
          mb.addStud(0.5, H, -0.5);
          mb.addStud(-0.5, H, 0.5);
        }
        break;
      }

      case 'cylinder': {
        const r = hw - INSET;
        mb.addCylinder(0, 0, 0, r, H, 22, 0.84, 1.0, true);
        if (def.studs) addTopStuds();
        break;
      }

      case 'cone': {
        const r0 = hw - INSET;
        const r1 = Math.max(0.32, r0 * 0.44);
        const lipH = PLATE_H * 0.45;
        mb.addCylinder(0, 0, 0, r0, lipH, 22, 0.82, 0.94, true);
        mb.addFrustum(0, lipH, 0, r0 * 0.96, r1, H - lipH, 22, 0.88, 1.0, false);
        if (def.studs) mb.addStud(0, H, 0, 14);
        break;
      }

      case 'jumper': {
        mb.addBox(x0, 0, z0, x1, H, z1);
        mb.addStud(0, H, 0, 14);
        break;
      }

      case 'grille': {
        mb.addBox(x0, 0, z0, x1, H * 0.48, z1);
        const slats = 4;
        const span = (x1 - x0);
        const sw = span / (slats * 2);
        for (let i = 0; i < slats; i++) {
          const sx = x0 + (i * 2 + 0.5) * sw;
          mb.addBox(sx, H * 0.48, z0 + 0.06, sx + sw, H, z1 - 0.06, 0.80, 1.0);
        }
        mb.addBox(x0, H * 0.48, z0, x1, H * 0.88, z0 + 0.08);
        mb.addBox(x0, H * 0.48, z1 - 0.08, x1, H * 0.88, z1);
        break;
      }

      case 'ingot': {
        mb.addBox(x0, 0, z0, x1, H * 0.45, z1);
        const bx = 0.14, bz = 0.14;
        const y0 = H * 0.45, y1 = H;
        mb.pushQuad([x0+bx,y1,z0+bz],[x0+bx,y1,z1-bz],[x1-bx,y1,z1-bz],[x1-bx,y1,z0+bz],[0,1,0]);
        mb.pushQuad([x0,y0,z1],[x1,y0,z1],[x1-bx,y1,z1-bz],[x0+bx,y1,z1-bz],[0,0.6,0.8]);
        mb.pushQuad([x1,y0,z0],[x0,y0,z0],[x0+bx,y1,z0+bz],[x1-bx,y1,z0+bz],[0,0.6,-0.8]);
        mb.pushQuad([x1,y0,z1],[x1,y0,z0],[x1-bx,y1,z0+bz],[x1-bx,y1,z1-bz],[0.8,0.6,0]);
        mb.pushQuad([x0,y0,z0],[x0,y0,z1],[x0+bx,y1,z1-bz],[x0+bx,y1,z0+bz],[-0.8,0.6,0]);
        break;
      }

      case 'slope': {
        const zMid = -hd + 1.0;
        const yLip = PLATE_H * 0.52;
        mb.extrudeZY([[z0, 0], [z1, 0], [z1, yLip], [zMid, H], [z0, H]], x0, x1);
        if (def.studs) {
          for (let ix = 0; ix < w; ix++) mb.addStud(-hw + ix + 0.5, H, -hd + 0.5, 12);
        }
        break;
      }

      case 'cheese': {
        const yLip = PLATE_H * 0.35;
        mb.extrudeZY([[z0, 0], [z1, 0], [z1, yLip], [z0 + 0.08, H], [z0, H]], x0, x1);
        break;
      }

      case 'inv_slope': {
        const zMid = -hd + 1.0;
        const yTopLip = H - PLATE_H * 0.55;
        mb.extrudeZY([[z0, 0], [zMid, 0], [z1, yTopLip], [z1, H], [z0, H]], x0, x1);
        if (def.studs) addTopStuds();
        break;
      }

      case 'double_slope': {
        const yLip = PLATE_H * 0.52;
        mb.extrudeZY([[z0, 0], [z1, 0], [z1, yLip], [0.1, H], [-0.1, H], [z0, yLip]], x0, x1);
        break;
      }

      case 'corner_slope_outer': {
        // 2x2 outer hip-roof corner: top stud at (-0.5, -0.5), slopes down toward +X and +Z
        const yLip = PLATE_H * 0.52;
        mb.addBox(x0, 0, z0, x1, yLip, z1);
        const mx = 0, mz = 0;
        // Top flat 1x1 square
        mb.pushQuad([x0, H, z0], [x0, H, mz], [mx, H, mz], [mx, H, z0], [0, 1, 0]);
        // Back & Left vertical walls
        mb.pushQuad([mx, yLip, z0], [x0, yLip, z0], [x0, H, z0], [mx, H, z0], [0, 0, -1]);
        mb.pushTri([x1, yLip, z0], [mx, yLip, z0], [mx, H, z0], [0, 0, -1]);
        mb.pushQuad([x0, yLip, z0], [x0, yLip, mz], [x0, H, mz], [x0, H, z0], [-1, 0, 0]);
        mb.pushTri([x0, yLip, mz], [x0, yLip, z1], [x0, H, mz], [-1, 0, 0]);
        // Front slope (+Z) & Right slope (+X) meeting along diagonal (mx,H,mz) -> (x1,yLip,z1)
        mb.pushQuad([x0, H, mz], [x0, yLip, z1], [x1, yLip, z1], [mx, H, mz], [0, 0.72, 0.69]);
        mb.pushQuad([mx, H, z0], [mx, H, mz], [x1, yLip, z1], [x1, yLip, z0], [0.69, 0.72, 0]);
        mb.addStud(-0.5, H, -0.5);
        break;
      }

      case 'corner_slope_inner': {
        // 2x2 inner valley roof corner: 3 high studs in L-shape, inner +X/+Z corner slopes down
        const yLip = PLATE_H * 0.52;
        mb.addBox(x0, 0, z0, x1, yLip, z1);
        mb.addBox(x0, yLip, z0, x1, H, 0);
        mb.addBox(x0, yLip, 0, 0, H, z1);
        // Sloped inner valley triangle pair from (0,H,0)-(x1,H,0)-(0,H,z1) down to (x1,yLip,z1)
        mb.pushTri([0, H, 0], [x1, yLip, z1], [x1, H, 0], [0, 0.72, 0.69]);
        mb.pushTri([0, H, 0], [0, H, z1], [x1, yLip, z1], [0.69, 0.72, 0]);
        mb.addStud(-0.5, H, -0.5);
        mb.addStud(0.5, H, -0.5);
        mb.addStud(-0.5, H, 0.5);
        break;
      }

      case 'curved_slope': {
        const yLip = PLATE_H * 0.42;
        const pts = [[z0, 0], [z1, 0], [z1, yLip]];
        const segs = 6;
        for (let i = 1; i <= segs; i++) {
          const t = i / segs; // 0 at z1 (lip) -> 1 at z0 (top)
          const ang = t * Math.PI * 0.5;
          const pz = z0 + Math.cos(ang) * (z1 - z0);
          const py = yLip + Math.sin(ang) * (H - yLip);
          pts.push([pz, py]);
        }
        pts.push([z0, H]);
        mb.extrudeZY(pts, x0, x1);
        break;
      }

      case 'pyramid': {
        const yLip = PLATE_H * 0.25;
        mb.addBox(x0, 0, z0, x1, yLip, z1);
        const apex = [0, H, 0];
        mb.pushTri([x0, yLip, z1], [x1, yLip, z1], apex, [0, 0.65, 0.76], 0.88, 0.88, 1);
        mb.pushTri([x1, yLip, z0], [x0, yLip, z0], apex, [0, 0.65, -0.76], 0.88, 0.88, 1);
        mb.pushTri([x1, yLip, z1], [x1, yLip, z0], apex, [0.76, 0.65, 0], 0.88, 0.88, 1);
        mb.pushTri([x0, yLip, z0], [x0, yLip, z1], apex, [-0.76, 0.65, 0], 0.88, 0.88, 1);
        break;
      }

      case 'arch': {
        // Pillars on left & right + curved arch underside + studded top beam
        const pW = w >= 6 ? 1.0 : 0.75;
        const span = hw - pW;
        const archTopY = H - PLATE_H * 0.9;
        const archStartY = H * 0.25;
        // Left & right solid pillars up to archStartY
        mb.addBox(x0, 0, z0, -span, H, z1);
        mb.addBox(span, 0, z0, x1, H, z1);
        // Segmented arch span above curve
        const segs = 10;
        for (let i = 0; i < segs; i++) {
          const a0 = Math.PI - (i / segs) * Math.PI;
          const a1 = Math.PI - ((i + 1) / segs) * Math.PI;
          const ax0 = Math.cos(a0) * span, ay0 = archStartY + Math.sin(a0) * (archTopY - archStartY);
          const ax1 = Math.cos(a1) * span, ay1 = archStartY + Math.sin(a1) * (archTopY - archStartY);
          // Front & back wall slices
          mb.pushQuad([ax0, ay0, z1], [ax1, ay1, z1], [ax1, H, z1], [ax0, H, z1], [0, 0, 1], 0.86, 0.86, 1, 1);
          mb.pushQuad([ax1, ay1, z0], [ax0, ay0, z0], [ax0, H, z0], [ax1, H, z0], [0, 0, -1], 0.86, 0.86, 1, 1);
          // Top face
          mb.pushQuad([ax0, H, z0], [ax0, H, z1], [ax1, H, z1], [ax1, H, z0], [0, 1, 0]);
          // Curved underside intrados
          const mx = (ax0 + ax1) * 0.5, my = (ay0 + ay1) * 0.5 - archStartY;
          const ml = Math.hypot(mx, my) || 1;
          mb.pushQuad([ax0, ay0, z0], [ax1, ay1, z0], [ax1, ay1, z1], [ax0, ay0, z1], [-mx / ml, -my / ml, 0], 0.72, 0.72, 0.72, 0.72);
        }
        if (def.studs) addTopStuds();
        break;
      }

      case 'dome': {
        const r = hw - INSET;
        const lipH = PLATE_H * 0.45;
        mb.addCylinder(0, 0, 0, r, lipH, 20, 0.84, 0.94, true);
        const rings = 6, segs = 20;
        const domeH = H - lipH;
        for (let ri = 0; ri < rings; ri++) {
          const t0 = (ri / rings) * Math.PI * 0.5;
          const t1 = ((ri + 1) / rings) * Math.PI * 0.5;
          const r0 = Math.cos(t0) * r, y0 = lipH + Math.sin(t0) * domeH;
          const r1 = Math.cos(t1) * r, y1 = lipH + Math.sin(t1) * domeH;
          mb.addFrustum(0, y0, 0, r0, Math.max(0.02, r1), y1 - y0, segs, 0.90 + 0.08 * (ri / rings), 0.94 + 0.06 * ((ri + 1) / rings), false);
        }
        if (def.studs) mb.addStud(0, H - 0.03, 0, 12);
        break;
      }

      case 'window': {
        const frame = 0.24;
        const sillH = PLATE_H * 0.7;
        mb.addBox(x0, 0, z0, x1, sillH, z1);             // sill
        mb.addBox(x0, H - sillH, z0, x1, H, z1);         // top lintel
        mb.addBox(x0, sillH, z0, x0 + frame, H - sillH, z1); // left jamb
        mb.addBox(x1 - frame, sillH, z0, x1, H - sillH, z1); // right jamb
        // Recessed cross mullions
        const mT = 0.07;
        mb.addBox(-mT, sillH, -0.10, mT, H - sillH, 0.10, 0.88, 0.98);
        mb.addBox(x0 + frame, H * 0.5 - mT, -0.10, x1 - frame, H * 0.5 + mT, 0.10, 0.88, 0.98);
        if (w >= 4) {
          mb.addBox(-1 - mT, sillH, -0.10, -1 + mT, H - sillH, 0.10, 0.88, 0.98);
          mb.addBox(1 - mT, sillH, -0.10, 1 + mT, H - sillH, 0.10, 0.88, 0.98);
        }
        if (def.studs) addTopStuds();
        break;
      }

      case 'door': {
        const jW = 0.36;
        const topH = PLATE_H * 1.1;
        mb.addBox(x0, 0, z0, x1, PLATE_H * 0.4, z1);
        mb.addBox(x0, PLATE_H * 0.4, z0, x0 + jW, H - topH, z1);
        mb.addBox(x1 - jW, PLATE_H * 0.4, z0, x1, H - topH, z1);
        mb.addBox(x0, H - topH, z0, x1, H, z1);
        if (def.studs) addTopStuds();
        break;
      }

      case 'fence': {
        mb.addBox(x0, 0, z0 + 0.15, x1, PLATE_H * 0.75, z1 - 0.15);
        mb.addBox(x0, H - PLATE_H * 0.75, z0 + 0.15, x1, H, z1 - 0.15);
        mb.addBox(x0 + 0.1, H * 0.45, -0.12, x1 - 0.1, H * 0.56, 0.12);
        const posts = w + 1;
        for (let i = 0; i < posts; i++) {
          const px = x0 + 0.14 + (i / (posts - 1)) * (x1 - x0 - 0.28);
          mb.addBox(px - 0.12, PLATE_H * 0.75, -0.15, px + 0.12, H - PLATE_H * 0.75, 0.15, 0.82, 0.96);
        }
        if (def.studs) addTopStuds();
        break;
      }

      case 'stairs': {
        const steps = d * 2;
        const stepD = (z1 - z0) / steps;
        const stepH = H / steps;
        for (let i = 0; i < steps; i++) {
          const sz0 = z0 + i * stepD;
          const sy1 = (steps - i) * stepH;
          mb.addBox(x0, 0, sz0, x1, sy1, sz0 + stepD);
        }
        for (let ix = 0; ix < w; ix++) mb.addStud(-hw + ix + 0.5, H, -hd + 0.5, 10);
        break;
      }

      case 'masonry': {
        const rec = 0.05;
        mb.addBox(x0, 0, z0 + rec, x1, H, z1 - rec);
        // Embossed staggered stone-brick blocks on front & back
        const rowH = H / 3;
        for (let row = 0; row < 3; row++) {
          const ry0 = row * rowH + 0.03, ry1 = (row + 1) * rowH - 0.03;
          if (row % 2 === 0) {
            mb.addBox(x0 + 0.04, ry0, z1 - rec, -0.03, ry1, z1);
            mb.addBox(0.03, ry0, z1 - rec, x1 - 0.04, ry1, z1);
            mb.addBox(x0 + 0.04, ry0, z0, -0.03, ry1, z0 + rec);
            mb.addBox(0.03, ry0, z0, x1 - 0.04, ry1, z0 + rec);
          } else {
            mb.addBox(x0 + 0.04, ry0, z1 - rec, -0.52, ry1, z1);
            mb.addBox(-0.46, ry0, z1 - rec, 0.46, ry1, z1);
            mb.addBox(0.52, ry0, z1 - rec, x1 - 0.04, ry1, z1);
            mb.addBox(x0 + 0.04, ry0, z0, -0.52, ry1, z0 + rec);
            mb.addBox(-0.46, ry0, z0, 0.46, ry1, z0 + rec);
            mb.addBox(0.52, ry0, z0, x1 - 0.04, ry1, z0 + rec);
          }
        }
        if (def.studs) addTopStuds();
        break;
      }

      case 'panel': {
        mb.addBox(x0, 0, z0, x1, PLATE_H * 0.7, z1); // base
        mb.addBox(x0, PLATE_H * 0.7, z0, x1, H, z0 + 0.22); // thin back wall
        mb.addBox(x0, PLATE_H * 0.7, z0 + 0.22, x0 + 0.2, H, z1); // left side flange
        mb.addBox(x1 - 0.2, PLATE_H * 0.7, z0 + 0.22, x1, H, z1); // right side flange
        break;
      }

      case 'technic': {
        mb.addBox(x0, 0, z0, x1, H, z1);
        // Authentic Technic circular pin-hole bosses on front & back between studs
        const holes = w - 1;
        for (let i = 0; i < holes; i++) {
          const hx = -hw + 1.0 + i;
          // Darkened recessed ring effect via protruding thin flange + inner darkened pin boss
          mb.addAxisCylinder(hx, H * 0.5, z1 + 0.015, 0.34, 0.03, 'z', 14, 0.90);
          mb.addAxisCylinder(hx, H * 0.5, z1 + 0.032, 0.23, 0.015, 'z', 14, 0.35);
          mb.addAxisCylinder(hx, H * 0.5, z0 - 0.015, 0.34, 0.03, 'z', 14, 0.90);
          mb.addAxisCylinder(hx, H * 0.5, z0 - 0.032, 0.23, 0.015, 'z', 14, 0.35);
        }
        if (def.studs) addTopStuds();
        break;
      }

      case 'snot1': {
        mb.addBox(x0, 0, z0, x1, H, z1);
        mb.addStud(0, H, 0);
        mb.addSideStud(0, H * 0.5, z1, '+z');
        break;
      }

      case 'snot4': {
        mb.addBox(x0, 0, z0, x1, H, z1);
        mb.addStud(0, H, 0);
        mb.addSideStud(0, H * 0.5, z1, '+z');
        mb.addSideStud(0, H * 0.5, z0, '-z');
        mb.addSideStud(x1, H * 0.5, 0, '+x');
        mb.addSideStud(x0, H * 0.5, 0, '-x');
        break;
      }

      case 'snot2': {
        mb.addBox(x0, 0, z0, x1, H, z1);
        addTopStuds();
        mb.addSideStud(-0.5, H * 0.5, z1, '+z');
        mb.addSideStud(0.5, H * 0.5, z1, '+z');
        break;
      }

      case 'headlight': {
        mb.addBox(x0, 0, z0, x1, H, 0.22);
        mb.addBox(x0, 0, 0.22, x1, PLATE_H * 0.65, z1);
        mb.addStud(0, H, -0.05);
        mb.addSideStud(0, H * 0.55, 0.22, '+z');
        break;
      }

      case 'bracket': {
        const pH = PLATE_H;
        mb.addBox(x0, H - pH, z0, x1, H, z1); // top plate
        mb.addBox(x0, 0, z1 - 0.24, x1, H - pH, z1); // downward skirt
        addTopStuds();
        mb.addSideStud(-0.5, (H - pH) * 0.5, z1, '+z');
        mb.addSideStud(0.5, (H - pH) * 0.5, z1, '+z');
        break;
      }

      case 'turntable': {
        mb.addBox(x0, 0, z0, x1, PLATE_H * 0.9, z1);
        mb.addCylinder(0, PLATE_H * 0.9, 0, hw - 0.08, H - PLATE_H * 0.9, 22, 0.78, 1.0, false);
        addTopStuds();
        break;
      }

      case 'wheel': {
        // Tire oriented along Z axis (rolling along X when rot=0, or Z when rot=1)
        const rOuter = H * 0.5;
        const widthW = (x1 - x0) * 0.86;
        // Tire cylinder + recessed hubcap
        mb.addAxisCylinder(0, rOuter, 0, rOuter, widthW, 'x', 22, 0.78);
        mb.addAxisCylinder(0, rOuter, 0, rOuter * 0.54, widthW + 0.05, 'x', 16, 0.95);
        mb.addAxisCylinder(0, rOuter, 0, rOuter * 0.20, widthW + 0.09, 'x', 12, 0.65);
        // Subtle top mounting axle block
        mb.addBox(-0.28, H - 0.25, -0.35, 0.28, H, 0.35);
        break;
      }

      case 'mudguard': {
        // 2x4 fender with curved wheel arch cutout along +Z face
        const span = 1.05;
        const archH = H - PLATE_H * 0.85;
        mb.addBox(x0, 0, z0, -span, H, z1);
        mb.addBox(span, 0, z0, x1, H, z1);
        mb.addBox(-span, archH, z0, span, H, z1);
        // Inner backing plate on -Z half
        mb.addBox(-span, 0, z0, span, archH, 0.0);
        // Curved wheel-well lips
        const segs = 8;
        for (let i = 0; i < segs; i++) {
          const a0 = Math.PI - (i / segs) * Math.PI;
          const a1 = Math.PI - ((i + 1) / segs) * Math.PI;
          const ax0 = Math.cos(a0) * span, ay0 = Math.sin(a0) * archH;
          const ax1 = Math.cos(a1) * span, ay1 = Math.sin(a1) * archH;
          mb.pushQuad([ax0, ay0, z1], [ax1, ay1, z1], [ax1, archH, z1], [ax0, archH, z1], [0, 0, 1], 0.85, 0.85, 1, 1);
          mb.pushQuad([ax0, ay0, 0], [ax1, ay1, 0], [ax1, ay1, z1], [ax0, ay0, z1], [0, -1, 0], 0.68, 0.68, 0.68, 0.68);
        }
        // Studs on both ends
        for (let iz = 0; iz < d; iz++) {
          mb.addStud(-hw + 0.5, H, -hd + iz + 0.5);
          mb.addStud(hw - 0.5, H, -hd + iz + 0.5);
        }
        break;
      }

      case 'windshield': {
        const yLip = PLATE_H * 0.65;
        const zBack = -hd + 1.0;
        mb.extrudeZY([[z0, 0], [z1, 0], [z1, yLip], [zBack, H], [z0, H]], x0, x1);
        for (let ix = 0; ix < w; ix++) mb.addStud(-hw + ix + 0.5, H, -hd + 0.5, 12);
        break;
      }

      case 'wing': {
        // Swept spoiler wing with upturned wingtips
        mb.addBox(x0, 0, z0, x1, H, z1);
        mb.addBox(x0, H, z0, x0 + 0.16, H + PLATE_H * 0.9, z1);
        mb.addBox(x1 - 0.16, H, z0, x1, H + PLATE_H * 0.9, z1);
        mb.addStud(-0.5, H, 0, 10);
        mb.addStud(0.5, H, 0, 10);
        break;
      }

      case 'dish': {
        const r = hw - INSET;
        mb.addCylinder(0, 0, 0, 0.42, PLATE_H * 0.7, 16, 0.8, 0.95, true);
        // Parabolic dish flare (outer + inner concave wall)
        mb.addFrustum(0, PLATE_H * 0.4, 0, 0.40, r, H - PLATE_H * 0.4, 22, 0.85, 1.0, false);
        mb.addCylinder(0, PLATE_H * 0.7, 0, 0.18, H * 0.75, 12, 0.82, 1.0, false);
        break;
      }

      case 'flower': {
        mb.addCylinder(0, 0, 0, 0.18, H * 0.6, 12, 0.78, 0.92, true);
        const yP = H * 0.58;
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          mb.addCylinder(Math.cos(a) * 0.28, yP, Math.sin(a) * 0.28, 0.21, H * 0.36, 10, 0.88, 1.0, true);
        }
        mb.addCylinder(0, yP + 0.05, 0, 0.18, H * 0.38, 12, 0.90, 1.0, false);
        break;
      }

      case 'foliage': {
        mb.addCylinder(0, 0, 0, 0.55, H * 0.45, 12, 0.78, 0.92, true);
        const lobes = [[-0.5, -0.45], [0.5, -0.45], [-0.45, 0.5], [0.45, 0.5], [0, 0]];
        lobes.forEach(([lx, lz], i) => {
          const lh = i === 4 ? H : H * 0.72;
          mb.addCylinder(lx, H * 0.22, lz, 0.48, lh - H * 0.22, 10, 0.82, 1.0, true);
        });
        addTopStuds(H * 0.72);
        break;
      }

      case 'pine': {
        // Classic tiered Lego conifer tree
        mb.addCylinder(0, 0, 0, 0.36, PLATE_H * 2.2, 12, 0.75, 0.88, true);
        const tiers = 4;
        const startY = PLATE_H * 1.8;
        const spanY = H - startY;
        for (let t = 0; t < tiers; t++) {
          const frac = t / tiers;
          const ty0 = startY + frac * spanY * 0.82;
          const th = (spanY / tiers) * 1.45;
          const rBase = (1.0 - frac * 0.21) * (hw - INSET);
          const rTop = Math.max(0.06, rBase * 0.24);
          mb.addFrustum(0, ty0, 0, rBase, rTop, Math.min(th, H - ty0), 8, 0.78, 1.0, true);
        }
        break;
      }

      case 'crystal': {
        mb.addCylinder(0, 0, 0, 0.32, PLATE_H * 0.6, 6, 0.80, 0.95, true);
        mb.addFrustum(0, PLATE_H * 0.6, 0, 0.30, 0.02, H - PLATE_H * 0.6, 6, 0.88, 1.0, false);
        mb.addFrustum(-0.18, PLATE_H * 0.4, 0.14, 0.16, 0.02, H * 0.62, 5, 0.86, 1.0, false);
        mb.addFrustum(0.18, PLATE_H * 0.4, -0.12, 0.15, 0.02, H * 0.54, 5, 0.86, 1.0, false);
        break;
      }
    }

    return mb.build();
  }

  // Baseplate & Ground Shadow Meshes
  const baseplateMesh = (() => {
    const mb = new MeshBuilder();
    const half = GRID_SIZE / 2;
    mb.addBox(-half - 0.12, -0.26, -half - 0.12, half + 0.12, 0, half + 0.12, 0.78, 0.97);
    for (let x = 0; x < GRID_SIZE; x++)
      for (let z = 0; z < GRID_SIZE; z++)
        mb.addStud(x - half + 0.5, 0, z - half + 0.5, 10);
    return mb.build();
  })();

  const groundShadowMesh = (() => {
    const mb = new MeshBuilder();
    const s = GRID_SIZE / 2 + 0.55;
    mb.pushQuad([-s, -0.27, -s], [-s, -0.27, s], [s, -0.27, s], [s, -0.27, -s], [0, 1, 0], 1, 1, 1, 1);
    return mb.build();
  })();

  function mat4Perspective(fovY, aspect, near, far) {
    const f = 1.0 / Math.tan(fovY / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, (2 * far * near) * nf, 0,
    ]);
  }

  function mat4LookAt(eye, target) {
    let fx = target[0] - eye[0], fy = target[1] - eye[1], fz = target[2] - eye[2];
    const fl = Math.hypot(fx, fy, fz) || 1;
    fx /= fl; fy /= fl; fz /= fl;
    let rx = -fz, ry = 0, rz = fx;
    const rl = Math.hypot(rx, ry, rz) || 1;
    rx /= rl; rz /= rl;
    const ux = ry * fz - rz * fy;
    const uy = rz * fx - rx * fz;
    const uz = rx * fy - ry * fx;
    return {
      view: new Float32Array([
        rx, ux, -fx, 0,
        ry, uy, -fy, 0,
        rz, uz, -fz, 0,
        -(rx * eye[0] + ry * eye[1] + rz * eye[2]),
        -(ux * eye[0] + uy * eye[1] + uz * eye[2]),
        (fx * eye[0] + fy * eye[1] + fz * eye[2]),
        1,
      ]),
      forward: [fx, fy, fz],
      right: [rx, ry, rz],
      up: [ux, uy, uz],
    };
  }

  function getCameraBasis(cam = state.cam) {
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    const eye = [
      cam.tx + cam.dist * cp * sy,
      cam.ty + cam.dist * sp,
      cam.tz + cam.dist * cp * cy,
    ];
    return { eye, ...mat4LookAt(eye, [cam.tx, cam.ty, cam.tz]) };
  }

  function bindMesh(mesh) {
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.buf);
    const stride = 7 * 4;
    gl.enableVertexAttribArray(LOC.aPos);
    gl.vertexAttribPointer(LOC.aPos, 3, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(LOC.aNorm);
    gl.vertexAttribPointer(LOC.aNorm, 3, gl.FLOAT, false, stride, 3 * 4);
    gl.enableVertexAttribArray(LOC.aAO);
    gl.vertexAttribPointer(LOC.aAO, 1, gl.FLOAT, false, stride, 6 * 4);
  }

  const FOV_Y = (40 * Math.PI) / 180;

  function renderScene(opts = {}) {
    const width = opts.width || canvas.width;
    const height = opts.height || canvas.height;
    const cam = opts.cam || state.cam;
    const bricksList = opts.bricks || state.bricks;
    const stepCount = opts.stepCount !== undefined ? opts.stepCount : state.visibleStep;
    const animIdx = opts.animIdx !== undefined ? opts.animIdx : state.animatingStepIndex;
    const dropProg = opts.dropProg !== undefined ? opts.dropProg : state.dropProgress;
    const showGhost = opts.showGhost !== undefined ? opts.showGhost : (state.mode === 'build' && !state.isPlaying && state.visibleStep === state.bricks.length);

    gl.viewport(0, 0, width, height);
    gl.clearColor(state.bgRgb[0], state.bgRgb[1], state.bgRgb[2], 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);

    const aspect = width / Math.max(1, height);
    const proj = mat4Perspective(FOV_Y, aspect, 0.2, 120.0);
    const basis = getCameraBasis(cam);

    gl.useProgram(program);
    gl.uniformMatrix4fv(LOC.uProj, false, proj);
    gl.uniformMatrix4fv(LOC.uView, false, basis.view);
    gl.uniform3fv(LOC.uCamPos, basis.eye);

    // 1. Soft shadow beneath baseplate
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    bindMesh(groundShadowMesh);
    gl.uniform3f(LOC.uOffset, 0.15, 0, 0.15);
    gl.uniform1f(LOC.uRotY, 0);
    gl.uniform3f(LOC.uColor, 0.0, 0.0, 0.0);
    gl.uniform1f(LOC.uAlpha, state.isDark ? 0.35 : 0.12);
    gl.uniform1f(LOC.uHighlight, 0);
    gl.uniform1f(LOC.uIsGround, 1);
    gl.uniform1f(LOC.uMetal, 0);
    gl.drawArrays(gl.TRIANGLES, 0, groundShadowMesh.count);
    gl.depthMask(true);
    gl.disable(gl.BLEND);

    // 2. Baseplate
    bindMesh(baseplateMesh);
    gl.uniform3f(LOC.uOffset, 0, 0, 0);
    gl.uniform1f(LOC.uRotY, 0);
    gl.uniform3fv(LOC.uColor, hexToRgb01(state.baseplateColor));
    gl.uniform1f(LOC.uAlpha, 1.0);
    gl.uniform1f(LOC.uHighlight, 0);
    gl.uniform1f(LOC.uIsGround, 1);
    gl.uniform1f(LOC.uMetal, 0);
    gl.drawArrays(gl.TRIANGLES, 0, baseplateMesh.count);

    // 3. Bricks
    const opaque = [];
    const trans = [];
    const limit = Math.min(stepCount, bricksList.length);
    for (let i = 0; i < limit; i++) {
      const b = bricksList[i];
      let yExtra = 0, alphaMul = 1.0;
      if (i === animIdx && dropProg < 1.0) {
        const ease = 1 - Math.pow(1 - dropProg, 3);
        yExtra = (1 - ease) * 3.4;
        alphaMul = 0.25 + 0.75 * ease;
      }
      const item = { b, idx: i, yExtra, alpha: b.alpha * alphaMul };
      if (item.alpha < 0.99) trans.push(item);
      else opaque.push(item);
    }

    const drawBrickItem = (item) => {
      const { b, idx, yExtra, alpha } = item;
      const dims = getBrickDims(b.type, b.rot);
      const cx = (b.x + dims.w * 0.5) - GRID_SIZE * 0.5;
      const cy = b.y * PLATE_H + yExtra;
      const cz = (b.z + dims.d * 0.5) - GRID_SIZE * 0.5;
      const mesh = getBrickMesh(b.type);
      bindMesh(mesh);
      gl.uniform3f(LOC.uOffset, cx, cy, cz);
      gl.uniform1f(LOC.uRotY, b.rot * Math.PI * 0.5);
      gl.uniform3fv(LOC.uColor, hexToRgb01(b.color));
      gl.uniform1f(LOC.uAlpha, alpha);
      gl.uniform1f(LOC.uIsGround, 0);
      gl.uniform1f(LOC.uMetal, b.metal ? 1.0 : 0.0);

      let hl = 0;
      if (!opts.noHighlight) {
        if (state.hoverBrickId === b.id) hl = state.mode === 'delete' ? -1.0 : 0.8;
        else if (state.selectedStepIdx === idx) hl = 0.65;
      }
      gl.uniform1f(LOC.uHighlight, hl);
      gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
    };

    for (let i = 0; i < opaque.length; i++) drawBrickItem(opaque[i]);

    if (trans.length || (showGhost && state.hoverPlacement)) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);

      trans.sort((a, b) => {
        const da = Math.hypot(a.b.x - 8 - basis.eye[0], a.b.y * PLATE_H - basis.eye[1], a.b.z - 8 - basis.eye[2]);
        const db = Math.hypot(b.b.x - 8 - basis.eye[0], b.b.y * PLATE_H - basis.eye[1], b.b.z - 8 - basis.eye[2]);
        return db - da;
      });
      for (let i = 0; i < trans.length; i++) drawBrickItem(trans[i]);

      if (showGhost && state.hoverPlacement) {
        const hp = state.hoverPlacement;
        const dims = getBrickDims(state.selectedType, state.rotation);
        const cx = (hp.x + dims.w * 0.5) - GRID_SIZE * 0.5;
        const cy = hp.y * PLATE_H;
        const cz = (hp.z + dims.d * 0.5) - GRID_SIZE * 0.5;
        const mesh = getBrickMesh(state.selectedType);
        bindMesh(mesh);
        gl.uniform3f(LOC.uOffset, cx, cy, cz);
        gl.uniform1f(LOC.uRotY, state.rotation * Math.PI * 0.5);
        gl.uniform3fv(LOC.uColor, hp.valid ? hexToRgb01(state.selectedColor) : [0.95, 0.2, 0.2]);
        gl.uniform1f(LOC.uAlpha, hp.valid ? 0.52 : 0.45);
        gl.uniform1f(LOC.uHighlight, hp.valid ? 0.25 : -0.8);
        gl.uniform1f(LOC.uIsGround, 0);
        gl.uniform1f(LOC.uMetal, state.selectedMetal ? 1.0 : 0.0);
        gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
      }

      gl.depthMask(true);
      gl.disable(gl.BLEND);
    }
  }

  // =========================================================================
  // 5. RAYCASTING & 3D BRICK SNAPPING
  // =========================================================================
  function screenToRay(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
    const ndcY = 1 - ((clientY - rect.top) / rect.height) * 2;
    const aspect = rect.width / Math.max(1, rect.height);
    const tanHalf = Math.tan(FOV_Y / 2);
    const basis = getCameraBasis();

    let dx = basis.forward[0] + basis.right[0] * (ndcX * aspect * tanHalf) + basis.up[0] * (ndcY * tanHalf);
    let dy = basis.forward[1] + basis.right[1] * (ndcX * aspect * tanHalf) + basis.up[1] * (ndcY * tanHalf);
    let dz = basis.forward[2] + basis.right[2] * (ndcX * aspect * tanHalf) + basis.up[2] * (ndcY * tanHalf);
    const len = Math.hypot(dx, dy, dz) || 1;
    return { origin: basis.eye, dir: [dx / len, dy / len, dz / len] };
  }

  function intersectAABB(origin, dir, minB, maxB) {
    let tMin = -Infinity, tMax = Infinity;
    let nx = 0, ny = 0, nz = 0;
    for (let axis = 0; axis < 3; axis++) {
      const o = origin[axis], d = dir[axis];
      const mn = minB[axis], mx = maxB[axis];
      if (Math.abs(d) < 1e-7) {
        if (o < mn || o > mx) return null;
      } else {
        let t1 = (mn - o) / d;
        let t2 = (mx - o) / d;
        let sign = -1;
        if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; sign = 1; }
        if (t1 > tMin) {
          tMin = t1;
          nx = axis === 0 ? sign : 0;
          ny = axis === 1 ? sign : 0;
          nz = axis === 2 ? sign : 0;
        }
        if (t2 < tMax) tMax = t2;
        if (tMin > tMax) return null;
      }
    }
    if (tMin < 0) return null;
    return {
      t: tMin,
      point: [origin[0] + dir[0] * tMin, origin[1] + dir[1] * tMin, origin[2] + dir[2] * tMin],
      normal: [nx, ny, nz],
    };
  }

  function raycastScene(clientX, clientY) {
    const { origin, dir } = screenToRay(clientX, clientY);
    let best = null;
    const visible = getVisibleBricks();
    const half = GRID_SIZE * 0.5;
    for (let i = 0; i < visible.length; i++) {
      const b = visible[i];
      const dims = getBrickDims(b.type, b.rot);
      const hit = intersectAABB(
        origin, dir,
        [b.x - half, b.y * PLATE_H, b.z - half],
        [b.x + dims.w - half, (b.y + dims.h) * PLATE_H, b.z + dims.d - half]
      );
      if (hit && (!best || hit.t < best.t)) best = { ...hit, brick: b, isBaseplate: false };
    }
    if (Math.abs(dir[1]) > 1e-6) {
      const t = -origin[1] / dir[1];
      if (t > 0 && (!best || t < best.t)) {
        const px = origin[0] + dir[0] * t;
        const pz = origin[2] + dir[2] * t;
        if (px >= -half && px <= half && pz >= -half && pz <= half) {
          best = { t, point: [px, 0, pz], normal: [0, 1, 0], brick: null, isBaseplate: true };
        }
      }
    }
    return best;
  }

  function computePlacementFromHit(hit) {
    if (!hit) return null;
    const dims = getBrickDims(state.selectedType, state.rotation);
    const half = GRID_SIZE * 0.5;
    const [nx, ny, nz] = hit.normal;
    const px = hit.point[0] + nx * 0.05;
    const py = hit.point[1] + ny * 0.05;
    const pz = hit.point[2] + nz * 0.05;

    const studX = Math.floor(px + half);
    const studZ = Math.floor(pz + half);

    let gx, gz, gy;
    if (hit.isBaseplate || ny > 0.5) {
      gx = studX - Math.floor(dims.w / 2);
      gz = studZ - Math.floor(dims.d / 2);
      gy = hit.brick ? hit.brick.y + getBrickDims(hit.brick.type, hit.brick.rot).h : 0;
    } else if (nx !== 0) {
      gx = nx > 0 ? studX : studX - dims.w + 1;
      gz = studZ - Math.floor(dims.d / 2);
      gy = hit.brick ? hit.brick.y : Math.max(0, Math.floor(py / PLATE_H));
    } else if (nz !== 0) {
      gx = studX - Math.floor(dims.w / 2);
      gz = nz > 0 ? studZ : studZ - dims.d + 1;
      gy = hit.brick ? hit.brick.y : Math.max(0, Math.floor(py / PLATE_H));
    } else {
      return null;
    }

    gx = Math.max(0, Math.min(GRID_SIZE - dims.w, gx));
    gz = Math.max(0, Math.min(GRID_SIZE - dims.d, gz));
    gy = Math.max(0, gy);

    const cand = { type: state.selectedType, x: gx, y: gy, z: gz, rot: state.rotation };
    let guard = 0;
    while (hasCollision(cand) && guard < 40) {
      let maxTop = cand.y + 1;
      const visible = getVisibleBricks();
      for (let i = 0; i < visible.length; i++) {
        if (bricksOverlap(cand, visible[i])) {
          const top = visible[i].y + getBrickDims(visible[i].type, visible[i].rot).h;
          if (top > maxTop) maxTop = top;
        }
      }
      cand.y = maxTop;
      guard++;
    }
    return { x: cand.x, y: cand.y, z: cand.z, valid: cand.y <= 54 };
  }

  // =========================================================================
  // 6. PURE-JS GIF89a ENCODER (MEDIAN-CUT 256 PALETTE + FAST LZW)
  // =========================================================================
  const GIFEncoder = (() => {
    const BAYER4 = [
       0,  8,  2, 10,
      12,  4, 14,  6,
       3, 11,  1,  9,
      15,  7, 13,  5,
    ].map(v => (v / 16) - 0.5);

    function buildMedianCutPalette(rgbaFrames, maxColors = 256) {
      const hist = new Uint32Array(32768);
      const stepFrame = Math.max(1, Math.floor(rgbaFrames.length / 10));
      for (let f = 0; f < rgbaFrames.length; f += stepFrame) {
        const data = rgbaFrames[f];
        for (let i = 0; i < data.length; i += 8) {
          const idx = ((data[i] >> 3) << 10) | ((data[i + 1] >> 3) << 5) | (data[i + 2] >> 3);
          hist[idx]++;
        }
      }
      const last = rgbaFrames[rgbaFrames.length - 1];
      for (let i = 0; i < last.length; i += 4) {
        const idx = ((last[i] >> 3) << 10) | ((last[i + 1] >> 3) << 5) | (last[i + 2] >> 3);
        hist[idx] += 2;
      }

      const entries = [];
      for (let i = 0; i < 32768; i++) {
        if (hist[i] > 0) {
          entries.push({
            r: ((i >> 10) & 31) * 8 + 4,
            g: ((i >> 5) & 31) * 8 + 4,
            b: (i & 31) * 8 + 4,
            count: hist[i],
          });
        }
      }
      if (entries.length === 0) entries.push({ r: 240, g: 240, b: 240, count: 1 });

      function makeBox(list) {
        let rMin = 255, rMax = 0, gMin = 255, gMax = 0, bMin = 255, bMax = 0, total = 0;
        for (let i = 0; i < list.length; i++) {
          const e = list[i];
          if (e.r < rMin) rMin = e.r; if (e.r > rMax) rMax = e.r;
          if (e.g < gMin) gMin = e.g; if (e.g > gMax) gMax = e.g;
          if (e.b < bMin) bMin = e.b; if (e.b > bMax) bMax = e.b;
          total += e.count;
        }
        const rr = rMax - rMin, gr = gMax - gMin, br = bMax - bMin;
        const axis = rr >= gr && rr >= br ? 'r' : (gr >= br ? 'g' : 'b');
        return { list, total, axis, range: Math.max(rr, gr, br) };
      }

      const boxes = [makeBox(entries)];
      while (boxes.length < maxColors) {
        let bestIdx = -1, bestScore = -1;
        for (let i = 0; i < boxes.length; i++) {
          const bx = boxes[i];
          if (bx.list.length < 2 || bx.range === 0) continue;
          const score = bx.range * Math.log2(bx.total + 2);
          if (score > bestScore) { bestScore = score; bestIdx = i; }
        }
        if (bestIdx === -1) break;
        const box = boxes.splice(bestIdx, 1)[0];
        const axis = box.axis;
        box.list.sort((a, b) => a[axis] - b[axis]);
        const halfTotal = box.total / 2;
        let acc = 0, split = 1;
        for (let i = 0; i < box.list.length - 1; i++) {
          acc += box.list[i].count;
          split = i + 1;
          if (acc >= halfTotal) break;
        }
        boxes.push(makeBox(box.list.slice(0, split)));
        boxes.push(makeBox(box.list.slice(split)));
      }

      const palette = new Uint8Array(256 * 3);
      const palCount = Math.min(256, boxes.length);
      for (let i = 0; i < palCount; i++) {
        const list = boxes[i].list;
        let rs = 0, gs = 0, bs = 0, cs = 0;
        for (let j = 0; j < list.length; j++) {
          const e = list[j];
          rs += e.r * e.count; gs += e.g * e.count; bs += e.b * e.count; cs += e.count;
        }
        palette[i * 3]     = Math.round(rs / cs);
        palette[i * 3 + 1] = Math.round(gs / cs);
        palette[i * 3 + 2] = Math.round(bs / cs);
      }

      const lut = new Uint8Array(32768);
      for (let r5 = 0; r5 < 32; r5++) {
        const r = r5 * 8 + 4;
        for (let g5 = 0; g5 < 32; g5++) {
          const g = g5 * 8 + 4;
          for (let b5 = 0; b5 < 32; b5++) {
            const b = b5 * 8 + 4;
            let bestDist = Infinity, bestI = 0;
            for (let p = 0; p < palCount; p++) {
              const dr = r - palette[p * 3];
              const dg = g - palette[p * 3 + 1];
              const db = b - palette[p * 3 + 2];
              const d = dr * dr * 2 + dg * dg * 4 + db * db * 3;
              if (d < bestDist) { bestDist = d; bestI = p; }
            }
            lut[(r5 << 10) | (g5 << 5) | b5] = bestI;
          }
        }
      }
      return { palette, lut };
    }

    function mapRgbaToIndexed(rgba, width, height, lut) {
      const out = new Uint8Array(width * height);
      for (let y = 0; y < height; y++) {
        const by = (y & 3) << 2;
        const rowOff = y * width;
        for (let x = 0; x < width; x++) {
          const p = (rowOff + x) << 2;
          const dither = BAYER4[by | (x & 3)] * 7;
          let r = rgba[p] + dither, g = rgba[p + 1] + dither, b = rgba[p + 2] + dither;
          r = r < 0 ? 0 : (r > 255 ? 255 : r);
          g = g < 0 ? 0 : (g > 255 ? 255 : g);
          b = b < 0 ? 0 : (b > 255 ? 255 : b);
          out[rowOff + x] = lut[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)];
        }
      }
      return out;
    }

    function lzwEncode(indices, outChunks) {
      const minCodeSize = 8, clearCode = 256, eoiCode = 257, HASH_SIZE = 5003;
      const htKey = new Int32Array(HASH_SIZE).fill(-1);
      const htVal = new Int16Array(HASH_SIZE);
      const subBlock = new Uint8Array(256);
      let subLen = 0;
      const frameBytes = [];

      const flushSubBlock = () => {
        if (subLen > 0) {
          frameBytes.push(subLen);
          for (let i = 0; i < subLen; i++) frameBytes.push(subBlock[i]);
          subLen = 0;
        }
      };

      let bitBuf = 0, bitCount = 0;
      const emitCode = (code, size) => {
        bitBuf |= (code << bitCount);
        bitCount += size;
        while (bitCount >= 8) {
          subBlock[subLen++] = bitBuf & 0xFF;
          if (subLen === 255) flushSubBlock();
          bitBuf >>= 8;
          bitCount -= 8;
        }
      };

      frameBytes.push(minCodeSize);
      let codeSize = 9, nextCode = 258;
      emitCode(clearCode, codeSize);

      if (indices.length > 0) {
        let prefix = indices[0];
        for (let i = 1; i < indices.length; i++) {
          const suffix = indices[i];
          const key = (prefix << 8) | suffix;
          let h = ((suffix << 4) ^ prefix) % HASH_SIZE;
          if (h < 0) h += HASH_SIZE;
          const step = h === 0 ? 1 : HASH_SIZE - h;
          let found = -1;
          while (htKey[h] !== -1) {
            if (htKey[h] === key) { found = htVal[h]; break; }
            h -= step;
            if (h < 0) h += HASH_SIZE;
          }
          if (found !== -1) {
            prefix = found;
          } else {
            emitCode(prefix, codeSize);
            if (nextCode < 4096) {
              htKey[h] = key;
              htVal[h] = nextCode;
              if (nextCode === (1 << codeSize) && codeSize < 12) codeSize++;
              nextCode++;
            } else {
              emitCode(clearCode, codeSize);
              htKey.fill(-1);
              codeSize = 9;
              nextCode = 258;
            }
            prefix = suffix;
          }
        }
        emitCode(prefix, codeSize);
      }

      emitCode(eoiCode, codeSize);
      if (bitCount > 0) subBlock[subLen++] = bitBuf & 0xFF;
      flushSubBlock();
      frameBytes.push(0x00);
      outChunks.push(new Uint8Array(frameBytes));
    }

    async function encode(width, height, frames, onProgress) {
      const rgbaList = frames.map(f => f.rgba);
      if (onProgress) onProgress(0.55, '최적 256색 팔레트 계산 중...');
      await new Promise(r => setTimeout(r, 0));

      const { palette, lut } = buildMedianCutPalette(rgbaList, 256);
      const chunks = [];
      const header = new Uint8Array(13);
      header.set([0x47, 0x49, 0x46, 0x38, 0x39, 0x61]);
      header[6] = width & 0xFF; header[7] = (width >> 8) & 0xFF;
      header[8] = height & 0xFF; header[9] = (height >> 8) & 0xFF;
      header[10] = 0xF7;
      chunks.push(header, palette);
      chunks.push(new Uint8Array([
        0x21, 0xFF, 0x0B,
        0x4E, 0x45, 0x54, 0x53, 0x43, 0x41, 0x50, 0x45, 0x32, 0x2E, 0x30,
        0x03, 0x01, 0x00, 0x00, 0x00,
      ]));

      for (let i = 0; i < frames.length; i++) {
        const f = frames[i];
        const delayCs = Math.max(2, Math.round(f.delayMs / 10));
        chunks.push(new Uint8Array([0x21, 0xF9, 0x04, 0x04, delayCs & 0xFF, (delayCs >> 8) & 0xFF, 0, 0]));
        chunks.push(new Uint8Array([0x2C, 0, 0, 0, 0, width & 0xFF, (width >> 8) & 0xFF, height & 0xFF, (height >> 8) & 0xFF, 0]));
        lzwEncode(mapRgbaToIndexed(f.rgba, width, height, lut), chunks);
        if (onProgress && (i % 3 === 0 || i === frames.length - 1)) {
          onProgress(0.58 + 0.42 * ((i + 1) / frames.length), `GIF 인코딩 중 (${i + 1}/${frames.length} 프레임)...`);
          await new Promise(r => setTimeout(r, 0));
        }
      }
      chunks.push(new Uint8Array([0x3B]));
      return new Blob(chunks, { type: 'image/gif' });
    }

    return { encode };
  })();
